<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>समूह साधन केंद्र समन्वयक मासिक दैनंदिनी</title>
    <style>
        :root {
            --primary-color: #003366; 
            --accent-color: #FF9933; 
            --bg-color: #f1f5f9;
            --text-color: #0f172a;
            --border-color: #cbd5e1;
            --holiday-bg: #fff1f2;
            --holiday-color: #be123c;
        }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0; padding: 14px; background-color: var(--bg-color); color: var(--text-color);
            line-height: 1.5; -webkit-tap-highlight-color: transparent;
        }
        .container {
            max-width: 1250px; margin: 0 auto; background: #ffffff; padding: 18px;
            border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        .header-section {
            text-align: center; background-color: var(--primary-color); color: #ffffff;
            padding: 24px 16px; border-radius: 6px 6px 0 0; margin-bottom: 16px;
            border-bottom: 5px solid var(--accent-color);
        }
        .header-section h1 { margin: 0; font-size: clamp(20px, 3vw, 28px); font-weight: 800; letter-spacing: 0.5px; }
        
        .info-row {
            display: flex; flex-direction: column; gap: 14px; background: #f8fafc;
            padding: 16px; border-radius: 6px; border: 1px solid var(--border-color); margin-bottom: 16px; text-align: center;
        }
        .info-group { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 12px; font-weight: 700; color: var(--primary-color); }
        .stylish-select-box { display: inline-flex; align-items: center; background: #ffffff; border: 1.5px solid var(--primary-color); border-radius: 4px; padding: 2px 6px; }
        .stylish-select-box select { font-family: inherit; font-size: clamp(14px, 1.7vw, 15px); font-weight: 700; color: var(--primary-color); background: transparent; border: none; outline: none; padding: 4px 8px; cursor: pointer; }
        
        /* Adjusted width for name input to prevent cutting */
        .editable-header-input { font-family: inherit; font-size: clamp(13px, 1.7vw, 15px); padding: 5px 10px; font-weight: 700; border: 1px solid var(--border-color); border-radius: 4px; background: #ffffff; text-align: center; flex: 1; min-width: 110px; color: #111827; }
        .name-input { min-width: 280px; max-width: 100%; }
        
        .location-fields { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%; }
        .location-item { display: flex; align-items: center; gap: 6px; font-size: clamp(13px, 1.7vw, 15px); font-weight: 600; }

        .sync-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 5px 14px; border-radius: 20px; background: #e2e8f0; color: #475569; font-weight: 700; margin: 0 auto; width: fit-content; }
        .sync-badge.synced { background: #dcfce7; color: #15803d; }
        .sync-badge.syncing { background: #fef9c3; color: #a16207; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: fixed; }
        th, td { border: 1px solid var(--border-color); padding: 8px; text-align: center; vertical-align: top; font-size: clamp(13px, 1.6vw, 14px); }
        th { background-color: #f1f5f9; color: var(--primary-color); font-weight: 800; padding: 10px 6px; vertical-align: middle; border-bottom: 2px solid var(--accent-color); }
        
        textarea { width: 100%; min-height: 48px; border: 1px solid var(--border-color); border-radius: 4px; font-family: inherit; font-size: clamp(13px, 1.5vw, 14px); padding: 6px; resize: vertical; text-align: left; }
        .school-select { width: 100%; padding: 6px; font-size: clamp(13px, 1.5vw, 14px); font-family: inherit; border-radius: 4px; border: 1px solid var(--border-color); background: #ffffff; text-align: left; margin-bottom: 4px; font-weight: 600;}

        .morning-block, .afternoon-block { display: none; }
        .mode-whole .morning-block { display: block; }
        .mode-morning .morning-block { display: block; }
        .mode-afternoon .afternoon-block { display: block; }
        .mode-both .morning-block, .mode-both .afternoon-block { display: block; }
        .mode-both .morning-block { border-bottom: 2px dashed #94a3b8; padding-bottom: 12px; margin-bottom: 12px; }

        .task-item { border-bottom: 1px dotted #cbd5e1; padding-bottom: 8px; margin-bottom: 8px; position: relative; }
        .task-item:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }

        .session-box { display: flex; flex-direction: column; align-items: flex-start; margin: 8px auto 0 auto; width: fit-content; background: #ffffff; border: 1px solid var(--border-color); border-radius: 4px; padding: 8px 12px; font-size: 13px; gap: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);}
        .session-box label { display: flex; align-items: center; gap: 6px; cursor: pointer; margin: 0; color: #1f2937; font-weight: 700; }

        .add-btn-group { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; align-items: center; }
        .task-btn { font-size: 11px; padding: 4px 8px; border: 1px solid; border-radius: 4px; font-weight: 700; cursor: pointer; display: none; width: 95%; transition: 0.2s; }
        .task-btn.morning-add-btn { background: #f0f9ff; color: var(--primary-color); border-color: var(--primary-color); }
        .task-btn.morning-add-btn:hover { background: var(--primary-color); color: white; }
        .task-btn.afternoon-add-btn { background: #fff7ed; color: #c2410c; border-color: var(--accent-color); }
        .task-btn.afternoon-add-btn:hover { background: var(--accent-color); color: white; border-color: var(--accent-color); }

        .task-timing { display: flex; gap: 2px; margin-bottom: 4px; justify-content: flex-start; align-items: center; background: #f8fafc; padding: 2px 4px; border-radius: 4px; border: 1px solid #e2e8f0; }
        .task-time-from, .task-time-to { width: 68px; font-size: 11px; padding: 2px; border: 1px solid #cbd5e1; border-radius: 3px; font-family: inherit; text-align: center; }
        
        .holiday-toggle-wrapper { margin-top: 8px; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; color: var(--holiday-color); font-weight: 700; background: var(--holiday-bg); padding: 4px; border-radius: 4px; border: 1px dashed #fda4af;}
        .holiday-row { background-color: var(--holiday-bg) !important; }
        .holiday-badge { display: inline-block; background: var(--holiday-color); color: white; padding: 2px 6px; border-radius: 2px; font-size: 11px; font-weight: 700; }
        .holiday-input-container { padding: 10px; text-align: center; }
        .holiday-input-container input { width: 85%; max-width: 340px; padding: 6px; font-family: inherit; font-size: clamp(13px, 1.6vw, 14px); font-weight: 700; color: var(--holiday-color); border: 1px solid #fca5a5; border-radius: 4px; text-align: center; background: #ffffff; }

        .no-screen { display: none; }
        .print-only-date-content { margin-top: 8px; font-weight: 800; font-size: 13px; color: var(--primary-color); }
        .morning-block-date, .afternoon-block-date { display: none; }
        .mode-morning .morning-block-date { display: block; }
        .mode-afternoon .afternoon-block-date { display: block; }
        .mode-both .morning-block-date, .mode-both .afternoon-block-date { display: block; }
        .mode-both .morning-block-date { border-bottom: 2px dashed #94a3b8; padding-bottom: 12px; margin-bottom: 12px; }

        .btn-container { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
        button.action-btn { width: 100%; padding: 12px 20px; font-size: 15px; font-family: inherit; font-weight: 700; cursor: pointer; border: none; border-radius: 6px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-print { background-color: var(--primary-color); color: white; }
        .btn-print:hover { background-color: #001a33; }
        .btn-sync { background-color: #16a34a; color: white; }
        .btn-admin { background-color: #475569; color: white; }
        .btn-fetch { background-color: #0284c7; color: white; }
        .btn-danger { background-color: #dc2626; color: white; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); justify-content: center; align-items: center; padding: 16px; }
        .modal-content { background-color: white; padding: 22px; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; text-align: left; }
        .modal-content h3 { margin: 0 0 12px 0; color: var(--primary-color); border-bottom: 2px solid var(--accent-color); padding-bottom: 8px; text-align: center; font-size: 18px; font-weight: 800;}
        .modal-content label { display: block; margin-top: 10px; font-weight: 600; font-size: 14px; }
        .modal-content input[type="password"] { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 14px;}
        .modal-actions { margin-top: 18px; display: flex; gap: 10px; }
        .danger-zone { margin-top: 15px; padding: 12px; border: 1px dashed #f87171; border-radius: 6px; background-color: #fef2f2; }
        .danger-zone h4 { margin: 0 0 10px 0; color: #b91c1c; font-size: 14px; text-align: center; }
        
        .switch-container { display: flex; align-items: center; justify-content: space-between; background: #f1f5f9; padding: 10px 14px; border-radius: 6px; border: 1px solid var(--border-color); margin-bottom: 15px; }
        .switch-container span { font-weight: 700; font-size: 14px; color: var(--primary-color); }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #16a34a; }
        input:checked + .slider:before { transform: translateX(20px); }

        .print-text { display: none; white-space: pre-wrap; word-break: break-word; text-align: left; }
        .print-task-time { display: none; font-size: 9pt; font-weight: 800; color: var(--primary-color); margin-bottom: 2px; }
        .serial-badge { display: inline-flex; align-items: center; justify-content: center; font-weight: 800; }

        @media screen and (max-width: 768px) {
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            tr { background: #ffffff; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 12px; padding: 10px; }
            td { border: none; padding: 4px 0; text-align: left; }
            .mobile-serial { display: none; }
            .date-cell-mobile { display: flex; flex-direction: column; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px !important; margin-bottom: 8px; font-size: 15px; text-align: center; }
            .field-label { display: block; font-size: 13px; font-weight: 800; color: var(--primary-color); margin-top: 8px; margin-bottom: 4px; background: #f1f5f9; padding: 4px; border-radius: 4px; border-left: 3px solid var(--accent-color);}
        }
        @media screen and (min-width: 769px) {
            .info-row { flex-direction: row; justify-content: space-between; }
            .location-fields { width: auto; }
            .btn-container { flex-direction: row; justify-content: center; }
            button.action-btn { width: auto; }
            .field-label { display: none; }
        }

        @media print {
            @page { size: A4 portrait; margin: 9mm 7mm; }

            :root {
                --morning-tint: #eaf4ff;
                --morning-accent: #0369a1;
                --afternoon-tint: #fff4e6;
                --afternoon-accent: #c2410c;
                --row-tint-a: #ffffff;
                --row-tint-b: #f5f8fc;
            }

            body {
                background: #ffffff !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                font-size: 9.5pt;
            }
            .container { box-shadow: none !important; padding: 0 !important; border: none !important; }

            .header-section {
                display: block !important;
                position: relative;
                padding: 10px 10px 12px 10px !important;
                margin: 0 0 3px 0 !important;
                border: none !important;
                border-radius: 6px 6px 0 0 !important;
                background: linear-gradient(135deg, var(--primary-color) 0%, #004a8f 100%) !important;
                color: #ffffff !important;
            }
            .header-section h1 { font-size: 15pt !important; color: #ffffff !important; font-weight: 800 !important; letter-spacing: 0.3px; }
            
            .header-section::after {
                content: ""; display: block; height: 5px; margin: 8px -10px -12px -10px;
                background: repeating-linear-gradient(
                    90deg,
                    var(--accent-color) 0px, var(--accent-color) 14px,
                    #ffffff 14px, #ffffff 18px,
                    var(--primary-color) 18px, var(--primary-color) 32px,
                    #ffffff 32px, #ffffff 36px
                ) !important;
            }

            .info-row {
                display: flex !important; flex-direction: row !important; justify-content: space-between !important;
                margin: 0 0 7px 0 !important; padding: 5px 10px !important;
                background-color: #fff9f0 !important;
                border: 1px solid var(--accent-color) !important;
                border-top: none !important; border-radius: 0 0 6px 6px !important;
            }
            .info-group, .location-item { color: var(--primary-color) !important; }

            .no-print, .sync-badge, select.school-select, .holiday-toggle-wrapper, .timing-wrapper, .session-box, .add-btn-group, .task-btn, .remove-task-btn, .task-timing { display: none !important; }
            .no-screen { display: block !important; }

            table { display: table !important; font-size: 9.5pt !important; border-collapse: collapse !important; width: 100% !important; border: 2px solid var(--primary-color) !important; }
            thead { display: table-header-group !important; }
            tbody { display: table-row-group !important; }
            tr { display: table-row !important; page-break-inside: avoid !important; }

            th, td { display: table-cell !important; padding: 5px 4px !important; border: 1px solid var(--border-color) !important; vertical-align: top !important; }
            th {
                background: var(--primary-color) !important; color: #ffffff !important; font-weight: 800 !important;
                border: 1px solid var(--primary-color) !important; border-bottom: 3px solid var(--accent-color) !important;
                padding: 7px 4px !important;
            }
            .mobile-serial { display: table-cell !important; text-align: center !important; width: 26px; }

            tbody tr:nth-child(odd)  { background-color: var(--row-tint-a) !important; }
            tbody tr:nth-child(even) { background-color: var(--row-tint-b) !important; }

            tbody tr td.mobile-serial { border-left: 4px solid var(--primary-color) !important; }
            tbody tr.holiday-row td.mobile-serial,
            tbody tr[data-is-holiday="true"] td.mobile-serial { border-left: 4px solid var(--holiday-color) !important; }

            .serial-badge { width: 20px; height: 20px; border-radius: 50%; background: var(--primary-color) !important; color: #ffffff !important; font-size: 8.5pt; font-weight: 800; }
            .serial-badge.holiday-serial-badge { background: var(--holiday-color) !important; }

            .date-cell-mobile { text-align: center !important; }
            .date-cell-mobile > div:first-child { font-weight: 800 !important; color: var(--primary-color) !important; font-size: 9.5pt !important; }

            tr.holiday-row, tr[data-is-holiday="true"] {
                background: repeating-linear-gradient( 135deg, var(--holiday-bg) 0px, var(--holiday-bg) 10px, #ffe4e9 10px, #ffe4e9 20px ) !important;
            }
            .holiday-badge { background-color: var(--holiday-color) !important; color: #ffffff !important; font-weight: 800; padding: 1px 6px !important; border-radius: 3px !important; border: none !important; }
            .holiday-input-container { text-align: center !important; }
            .holiday-input-container input {
                border: none !important; background: transparent !important; width: 100% !important;
                color: var(--holiday-color) !important; font-size: 10.5pt !important; font-weight: 800 !important;
            }

            .session-block { border-radius: 4px; padding: 3px 4px !important; margin-bottom: 3px; }
            .morning-block { background: var(--morning-tint) !important; border-left: 3px solid var(--morning-accent) !important; }
            .afternoon-block { background: var(--afternoon-tint) !important; border-left: 3px solid var(--afternoon-accent) !important; }

            .mode-both .morning-block { border-bottom: 1.5px dashed var(--primary-color) !important; padding-bottom: 5px !important; margin-bottom: 5px !important; }

            .morning-block-date { display: inline-block !important; background: var(--morning-accent) !important; color: #fff !important; font-size: 8pt !important; font-weight: 800 !important; padding: 1px 7px !important; border-radius: 8px !important; margin-bottom: 3px !important; }
            .afternoon-block-date { display: inline-block !important; background: var(--afternoon-accent) !important; color: #fff !important; font-size: 8pt !important; font-weight: 800 !important; padding: 1px 7px !important; border-radius: 8px !important; margin-bottom: 3px !important; margin-top: 2px !important; }
            .print-only-date-content { text-align: center !important; margin-top: 5px !important; }

            textarea { display: none !important; }
            .task-item { border-bottom: 1px dotted #94a3b8 !important; padding: 2px 0 3px 10px !important; margin-bottom: 3px !important; position: relative !important; }
            .task-item::before { content: ""; position: absolute; left: 0; top: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent-color) !important; }
            .print-text { display: block !important; font-size: 9.5pt !important; padding: 1px 0 !important; text-align: left !important; }
            .print-task-time { display: inline-block !important; font-size: 7.5pt !important; font-weight: 800 !important; color: #ffffff !important; background: var(--primary-color) !important; padding: 0px 5px !important; border-radius: 6px !important; margin-bottom: 3px !important; }

            .field-label { display: none !important; }
            .stylish-select-box select, .editable-header-input { border: none !important; background: transparent !important; padding: 0 !important; -webkit-appearance: none; color: var(--text-color) !important; font-weight: bold; }
            .stylish-select-box { border: none !important; box-shadow: none !important; }

            td.col-planned  { border-top: 2px solid #0284c7 !important; }
            td.col-actual   { border-top: 2px solid #16a34a !important; }
            td.col-work     { border-top: 2px solid #7c3aed !important; }
            td.col-remarks  { border-top: 2px solid #db2777 !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1>समूह साधन केंद्र समन्वयक मासिक दैनंदिनी</h1>
    </div>

    <div class="info-row">
        <div class="info-group">
            <label>महिना व वर्ष:</label>
            <div class="stylish-select-box"><select id="monthSelect" onchange="onMonthYearChange()"></select></div>
            <div class="stylish-select-box"><select id="yearSelect" onchange="onMonthYearChange()"></select></div>
        </div>
        <div class="location-fields">
            <div class="location-item"><b>केंद्रप्रमुख नाव:</b><input type="text" id="kendraPramukhNameInput" class="editable-header-input name-input" value="श्री. / सौ. " oninput="handleFormChange()"></div>
            <div class="location-item"><b>केंद्र:</b><input type="text" id="kendraInput" class="editable-header-input" value="रविवार पेठ" oninput="handleFormChange()"></div>
            <div class="location-item"><b>तालुका:</b><input type="text" id="talukaInput" class="editable-header-input" value="अंबाजोगाई" oninput="handleFormChange()"></div>
            <div class="location-item"><b>जिल्हा:</b><input type="text" id="jilhaInput" class="editable-header-input" value="बीड" oninput="handleFormChange()"></div>
        </div>
    </div>

    <div style="text-align:center; margin-bottom: 10px;" class="no-print">
        <div id="syncStatus" class="sync-badge">स्थानिक ड्राफ्ट सक्रिय</div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 5%;">अ. क्र.</th>
                <th style="width: 15%;">📅 दिनांक/वार</th>
                <th style="width: 20%;">🎯 नियोजित भेट</th>
                <th style="width: 20%;">✅ प्रत्यक्ष भेट</th>
                <th style="width: 20%;">🗂️ कामाचे स्वरूप</th>
                <th style="width: 20%;">📝 शेरा</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <div class="btn-container no-print">
        <button class="action-btn btn-print" onclick="prepareAndPrint()">PDF डाउनलोड करा / प्रिंट करा</button>
        <button class="action-btn btn-admin" onclick="openAdminPanel('panel')">केंद्रप्रमुख पॅनेल (सिंक व सेटिंग्ज)</button>
    </div>
</div>

<!-- Admin Modal -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <h3 id="modalHeading">केंद्रप्रमुख लॉगिन व सेटिंग्ज</h3>
        <div id="loginStep">
            <label>केंद्रप्रमुख PIN टाका:</label>
            <input type="password" id="authPinInput" placeholder="PIN टाका">
            <div class="modal-actions">
                <button type="button" class="action-btn btn-admin" onclick="closeAdminModal()">रद्द करा</button>
                <button type="button" class="action-btn btn-sync" onclick="verifyAdminLogin()">लॉगिन करा</button>
            </div>
        </div>
        <div id="adminControlsStep" style="display:none;">
            <p style="font-size: 14px; color: #15803d; font-weight: bold; text-align: center; margin: 0 0 15px 0;">✓ केंद्रप्रमुख प्रमाणीकरण यशस्वी</p>
            <div class="switch-container">
                <span>स्वयंचलित सिंक (Auto-Sync)</span>
                <label class="switch"><input type="checkbox" id="autoSyncToggle" onchange="toggleAutoSync()"><span class="slider"></span></label>
            </div>
            <div style="margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px;">
                <button type="button" class="action-btn btn-sync" onclick="triggerManualSync()">ऑनलाइन सेव्ह करा</button>
                <button type="button" class="action-btn btn-fetch" onclick="fetchFromGoogleSheets()">ऑनलाइन डेटा मिळवा</button>
            </div>
            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">
            <label>नवीन PIN:</label>
            <input type="password" id="newPin" placeholder="नवीन PIN">
            <label>नवीन PIN ची पुष्टी करा:</label>
            <input type="password" id="confirmNewPin" placeholder="पुन्हा नवीन PIN टाका">
            <button type="button" class="action-btn btn-sync" style="margin-top: 10px;" onclick="saveNewPinOnline()">PIN ऑनलाइन बदला</button>
            <div class="danger-zone">
                <h4>धोक्याचा इशारा</h4>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button type="button" class="action-btn btn-admin" onclick="clearLocalStorageDraft()">केवळ लोकल ड्राफ्ट डिलीट करा</button>
                    <button type="button" class="action-btn btn-danger" onclick="deleteFromGoogleSheets()">ऑनलाइन शीट मधील डेटा डिलीट करा</button>
                </div>
            </div>
            <div class="modal-actions" style="margin-top: 15px;">
                <button type="button" class="action-btn btn-danger" onclick="logoutAdmin()" style="width: 100%;">लॉगआउट</button>
                <button type="button" class="action-btn btn-admin" onclick="closeAdminModal()" style="width: 100%;">बंद करा</button>
            </div>
        </div>
    </div>
</div>

<script>
    const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw8nCZspj98-skk_zIVhP0V0gPVd8i0koezh5_QefBjAsMdpxvOIHjPKOlOK_Yei8g/exec"; 

    const monthsMarathi = ["जानेवारी", "फेब्रुवारी", "मार्च", "एप्रिल", "मे", "जून", "जुलै", "ऑगस्ट", "सप्टेंबर", "ऑक्टोबर", "नोव्हेंबर", "डिसेंबर"];
    const daysMarathi = ["रविवार", "सोमवार", "मंगळवार", "बुधवार", "गुरुवार", "शुक्रवार", "शनिवार"];
    
    const schoolsList = [
        "सी.पी.एस. रविवार पेठ", "जि.प.प्रा.शा. क्र. २, अंबाजोगाई", "जि.प.प्रा.शा. साकुड (मराठी)", 
        "जि.प.प्रा.शा. साकुड (उर्दू)", "जि.प.प्रा.शा. काळवटी तांडा क्र. १", "जि.प.प्रा.शा. काळवटी तांडा क्र. ३", 
        "जि.प.प्रा.शा. भीमाई वस्ती", "जि.प.प्रा.शा. काळवटी तांडा क्र. २", "जि.प.प्रा.शा. मांडवा पठाण", 
        "जि.प.प्रा.शा. मांडवा तांडा", "जि.प.प्रा.शा. पोलेवाडी", "जि.प.प्रा.शा. नागझरी वसाहत", 
        "जि.प.प्रा.शा. शेपवाडी", "जि.प.प्रा.शा. सह्याद्री नगर शेपवाडी", "जि.प.प्रा.शा. पिंपळा धायगुडा (मराठी)", 
        "जि.प.प्रा.शा. पिंपळा धायगुडा (उर्दू)", "जि.प.प्रा.शा. वरवटी", "जि.प.प्रा.शा. उघडे वस्ती (वरवटी)", 
        "जि.प.प्रा.शा. तलाव पाटी", "जि.प.प्रा.शा. अंबलवाडी", "जि.प. प्रा. शा. गोलटावस्ती", 
        "जि.प.प्रा.शा. गिरवली आपेट", "जि.प.हा.स्कू. गिरवली",
        "समूह साधन केंद्र रविवार पेठ", "गटशिक्षणाधिकारी कार्यालय अंबाजोगाई"
    ];

    let autoSyncTimer = null;
    let verifiedSessionPin = sessionStorage.getItem('KP_ADMIN_PIN') || "";
    let isAutoSyncEnabled = localStorage.getItem('KP_AUTOSYNC') !== 'false';

    function initDates() {
        const monthSelect = document.getElementById('monthSelect');
        const yearSelect = document.getElementById('yearSelect');
        const currentDate = new Date();
        monthsMarathi.forEach((month, index) => {
            let option = document.createElement('option');
            option.value = index; option.textContent = month;
            if (index === currentDate.getMonth()) option.selected = true;
            monthSelect.appendChild(option);
        });
        let currentYear = currentDate.getFullYear();
        for (let y = currentYear - 2; y <= currentYear + 5; y++) {
            let option = document.createElement('option');
            option.value = y; option.textContent = y;
            if (y === currentYear) option.selected = true;
            yearSelect.appendChild(option);
        }
        document.getElementById('autoSyncToggle').checked = isAutoSyncEnabled;
        loadFormData();
    }

    function validateTime(input, min, max) {
        if(!input.value) return;
        const row = input.closest('tr');
        const isWhole = row.querySelector('.cb-whole').checked;
        
        let actualMax = max;
        if(isWhole && min === '08:00') { actualMax = '17:00'; }

        if (input.value < min || input.value > actualMax) {
            alert(`कृपया वेळ ${min} ते ${actualMax} च्या दरम्यान निवडा.`);
            input.value = '';
        }
    }

    function getSchoolDropdownHTML(placeholderText, className) {
        let optionsHTML = `<option value="">-- शाळा निवडा --</option>`;
        schoolsList.forEach(school => optionsHTML += `<option value="${school}">${school}</option>`);
        optionsHTML += `<option value="manual">इतर (मॅन्युअल)</option>`;
        return `<select class="school-select no-print" onchange="handleDropdownSelect(this)">${optionsHTML}</select>
                <textarea class="${className}" placeholder="${placeholderText}" oninput="handleFormChange(this)"></textarea><div class="print-text"></div>`;
    }

    function getWorkNatureDropdownHTML(className) {
        return `<select class="school-select no-print" onchange="handleDropdownSelect(this)">
                    <option value="">-- स्वरूप निवडा --</option>
                    <option value="नियोजित शाळा भेट">नियोजित शाळा भेट</option>
                    <option value="आकस्मिक शाळा भेट">आकस्मिक शाळा भेट</option>
                    <option value="manual">इतर (टाइप करा)</option>
                </select>
                <textarea class="${className}" placeholder="कामाचे स्वरूप लिहा..." oninput="handleFormChange(this)"></textarea><div class="print-text"></div>`;
    }

    function handleDropdownSelect(selectElement) {
        const textarea = selectElement.nextElementSibling;
        if (selectElement.value === "manual") { textarea.value = ""; textarea.focus(); }
        else if (selectElement.value !== "") { textarea.value = selectElement.value; }
        handleFormChange(textarea);
    }

    function getTaskItemHTMLInner(colType, isRemarks = false, sessionType = 'morning') {
        let inputHTML = '';
        let timeHTML = '';
        
        // Time selection for Planned & Actual cell
        if (colType === 'planned' || colType === 'actual') {
            let minT = sessionType === 'morning' ? '08:00' : '14:00';
            let maxT = sessionType === 'morning' ? '13:00' : '16:30';
            
            timeHTML = `
            <div class="task-timing no-print">
                <span style="font-size:10px; font-weight:700; color:var(--primary-color);">वेळ:</span>
                <input type="time" class="task-time-from" min="${minT}" max="${maxT}" onchange="validateTime(this, '${minT}', '${maxT}'); handleFormChange(this);">
                <span style="font-size:10px;">ते</span>
                <input type="time" class="task-time-to" min="${minT}" max="${maxT}" onchange="validateTime(this, '${minT}', '${maxT}'); handleFormChange(this);">
            </div>
            <div class="print-task-time"></div>
            `;
            
            inputHTML = timeHTML + getSchoolDropdownHTML('भेट...', `input-${colType}`);
        } else if (colType === 'work') {
            inputHTML = getWorkNatureDropdownHTML(`input-${colType}`);
        } else {
            inputHTML = `<textarea class="input-${colType}" placeholder="शेरा..." oninput="handleFormChange(this)"></textarea><div class="print-text"></div>`;
        }
        
        let removeBtn = `<button type="button" class="remove-task-btn no-print" onclick="removeTask(this)" title="काम काढून टाका" style="background:transparent; color:#dc2626; border:1px solid #dc2626; border-radius:4px; padding:2px 6px; cursor:pointer; font-size:11px; margin-left:6px; font-weight:900;">[X]</button>`;
        
        if (isRemarks) {
             return `<div style="display:flex; gap:2px; align-items:flex-start;">
                        <div style="flex:1; width:100%;">${inputHTML}</div>
                        ${removeBtn}
                     </div>`;
        }
        return inputHTML;
    }

    function getCellTemplate() {
        return `
            <div class="session-block morning-block">
                <div class="task-list"></div>
            </div>
            <div class="session-block afternoon-block">
                <div class="task-list"></div>
            </div>
        `;
    }

    function addTaskToDOM(tr, sessionType) {
        const blockClass = sessionType === 'morning' ? '.morning-block' : '.afternoon-block';
        ['planned', 'actual', 'work', 'remarks'].forEach(col => {
            const list = tr.querySelector(`.col-${col} ${blockClass} .task-list`);
            if(list) {
                const div = document.createElement('div');
                div.className = 'task-item';
                div.innerHTML = getTaskItemHTMLInner(col, col === 'remarks', sessionType);
                list.appendChild(div);
            }
        });
    }

    function addTaskBtnClick(btn, sessionType) {
        const tr = btn.closest('tr');
        addTaskToDOM(tr, sessionType);
        handleFormChange(tr);
    }

    function removeTask(btn) {
        const taskItem = btn.closest('.task-item');
        const taskList = taskItem.parentElement;
        const sessionBlock = taskList.parentElement;
        const tr = sessionBlock.closest('tr');

        const sessionClass = sessionBlock.classList.contains('morning-block') ? '.morning-block' : '.afternoon-block';
        const taskItems = Array.from(taskList.children);
        const index = taskItems.indexOf(taskItem);

        if(taskItems.length <= 1) {
            alert("सत्रातील किमान एक काम ठेवणे आवश्यक आहे. तुम्ही बॉक्स रिकामा सोडू शकता.");
            return;
        }

        ['planned', 'actual', 'work', 'remarks'].forEach(col => {
            const items = tr.querySelectorAll(`.col-${col} ${sessionClass} .task-item`);
            if(items[index]) items[index].remove();
        });

        handleFormChange(tr);
    }

    function handleSessionToggle(checkbox, type) {
        const row = checkbox.closest('tr');
        const cbWhole = row.querySelector('.cb-whole');
        const cbMorning = row.querySelector('.cb-morning');
        const cbAfternoon = row.querySelector('.cb-afternoon');

        if (type === 'whole' && cbWhole.checked) {
            cbMorning.checked = false; 
            cbAfternoon.checked = false;
        } else if ((type === 'morning' || type === 'afternoon') && checkbox.checked) {
            cbWhole.checked = false;
        }
        
        if (!cbWhole.checked && !cbMorning.checked && !cbAfternoon.checked) {
            cbWhole.checked = true;
        }

        updateRowSessionUI(row);
        
        if (cbMorning.checked && row.querySelectorAll('.col-planned .morning-block .task-item').length === 0) addTaskToDOM(row, 'morning');
        if (cbAfternoon.checked && row.querySelectorAll('.col-planned .afternoon-block .task-item').length === 0) addTaskToDOM(row, 'afternoon');
        if (cbWhole.checked && row.querySelectorAll('.col-planned .morning-block .task-item').length === 0) addTaskToDOM(row, 'morning');

        handleFormChange(checkbox);
    }

    function updateRowSessionUI(row) {
        if (row.getAttribute('data-is-holiday') === 'true') return;
        
        const cbWhole = row.querySelector('.cb-whole').checked;
        const cbMorn = row.querySelector('.cb-morning').checked;
        const cbAft = row.querySelector('.cb-afternoon').checked;

        row.classList.remove('mode-whole', 'mode-morning', 'mode-afternoon', 'mode-both');
        
        if (cbWhole) row.classList.add('mode-whole');
        else if (cbMorn && cbAft) row.classList.add('mode-both');
        else if (cbMorn) row.classList.add('mode-morning');
        else if (cbAft) row.classList.add('mode-afternoon');

        const btnM = row.querySelector('.morning-add-btn');
        const btnA = row.querySelector('.afternoon-add-btn');
        if(btnM) btnM.style.display = (cbMorn || cbWhole) ? 'block' : 'none';
        if(btnA) btnA.style.display = cbAft ? 'block' : 'none';
    }

    function generateTableStructure() {
        const month = parseInt(document.getElementById('monthSelect').value);
        const year = parseInt(document.getElementById('yearSelect').value);
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 1; i <= daysInMonth; i++) {
            let date = new Date(year, month, i);
            let isSunday = date.getDay() === 0;
            let dayName = daysMarathi[date.getDay()];
            let dateText = `${i} ${monthsMarathi[month]} <span class="no-print">${year}</span> <b>(${dayName})</b>`;
            let row = document.createElement('tr');
            row.setAttribute('data-date', `${i} ${monthsMarathi[month]} ${year}`);
            row.setAttribute('data-day-index', i);
            row.setAttribute('data-is-sunday', isSunday ? 'true' : 'false');

            if (isSunday) renderHolidayRow(row, i, dateText, "सार्वजनिक सुट्टी (रविवार)", true);
            else renderNormalRow(row, i, dateText);
            
            tbody.appendChild(row);
        }
    }

    function renderNormalRow(row, i, dateText) {
        let isSunday = row.getAttribute('data-is-sunday') === 'true';
        row.className = 'mode-whole'; 
        row.setAttribute('data-is-holiday', 'false');
        
        let extraBadge = isSunday ? `<div class="holiday-badge working-sunday-badge" style="margin-top:4px;">कामकाज (रविवार)</div>` : ``;

        row.innerHTML = `
            <td class="mobile-serial"><span class="serial-badge">${i}</span></td>
            <td class="date-cell-mobile">
                <div>${dateText}</div>
                ${extraBadge}
                <div class="session-box no-print">
                    <label><input type="checkbox" class="cb-whole" onchange="handleSessionToggle(this, 'whole')" checked> पूर्ण दिवस (Default)</label>
                    <label><input type="checkbox" class="cb-morning" onchange="handleSessionToggle(this, 'morning')"> सकाळ सत्र</label>
                    <label><input type="checkbox" class="cb-afternoon" onchange="handleSessionToggle(this, 'afternoon')"> दुपार सत्र</label>
                </div>
                <div class="add-btn-group no-print">
                    <button type="button" class="task-btn morning-add-btn" onclick="addTaskBtnClick(this, 'morning')">+ काम जोडा (सकाळ)</button>
                    <button type="button" class="task-btn afternoon-add-btn" onclick="addTaskBtnClick(this, 'afternoon')">+ काम जोडा (दुपार)</button>
                </div>
                <label class="holiday-toggle-wrapper no-print">
                    <input type="checkbox" onchange="toggleManualHoliday(this, ${i})">
                    <span>सुट्टी घोषित करा</span>
                </label>
                <div class="print-only-date-content no-screen">
                    <div class="morning-block-date">🌅 सकाळ सत्र</div>
                    <div class="afternoon-block-date">🌇 दुपार सत्र</div>
                </div>
            </td>
            <td class="col-planned"><span class="field-label">१. नियोजित भेट:</span>${getCellTemplate()}</td>
            <td class="col-actual"><span class="field-label">२. प्रत्यक्ष भेट:</span>${getCellTemplate()}</td>
            <td class="col-work"><span class="field-label">३. कामाचे स्वरूप:</span>${getCellTemplate()}</td>
            <td class="col-remarks"><span class="field-label">४. शेरा:</span>${getCellTemplate()}</td>
        `;
        addTaskToDOM(row, 'morning'); 
        addTaskToDOM(row, 'afternoon'); 
        updateRowSessionUI(row);
    }

    function renderHolidayRow(row, i, dateText, reasonText, isSunday = false) {
        row.className = 'holiday-row';
        row.setAttribute('data-is-holiday', 'true');
        let badgeHTML = isSunday ? `<div class="holiday-badge" style="margin-bottom:4px;">रविवार सुट्टी</div>` : ``;

        row.innerHTML = `
            <td class="mobile-serial"><span class="serial-badge holiday-serial-badge">${i}</span></td>
            <td class="date-cell-mobile">
                <div>${dateText}</div>${badgeHTML}
                <label class="holiday-toggle-wrapper no-print" style="color:#15803d; border-color:#16a34a; background:#dcfce7;">
                     <input type="checkbox" checked onchange="toggleManualHoliday(this, ${i})"><span>काम नोंदवा (सुट्टी रद्द)</span>
                </label>
                <div class="print-only-date-content no-screen">
                    <div style="font-weight:bold; font-size:10pt; color:var(--holiday-color); margin-top:8px;">सुट्टी</div>
                </div>
            </td>
            <td colspan="4" class="holiday-input-container">
                <input type="text" class="holiday-reason-input" value="${reasonText}" oninput="handleFormChange()" placeholder="सुट्टीचे कारण लिहा...">
            </td>
        `;
    }

    function toggleManualHoliday(checkbox, i) {
        const month = parseInt(document.getElementById('monthSelect').value);
        const year = parseInt(document.getElementById('yearSelect').value);
        const row = checkbox.closest('tr');
        const isSunday = row.getAttribute('data-is-sunday') === 'true';
        let date = new Date(year, month, i);
        let dateText = `${i} ${monthsMarathi[month]} <span class="no-print">${year}</span> <b>(${daysMarathi[date.getDay()]})</b>`;

        if (checkbox.checked) {
            let defReason = isSunday ? "सार्वजनिक सुट्टी (रविवार)" : "सार्वजनिक सुट्टी";
            let reason = isSunday ? defReason : prompt("सुट्टीचे नाव / स्वरूप लिहा:", defReason);
            renderHolidayRow(row, i, dateText, reason || defReason, isSunday);
        } else { renderNormalRow(row, i, dateText); }
        handleFormChange();
    }

    function syncRowVisuals(row) {
        row.querySelectorAll('textarea').forEach(tx => {
            const printDiv = tx.nextElementSibling;
            if (printDiv && printDiv.classList.contains('print-text')) printDiv.textContent = tx.value;
        });
        
        if (row.getAttribute('data-is-holiday') === 'false') {
            row.querySelectorAll('.col-planned .task-item, .col-actual .task-item').forEach(item => {
                const tf = item.querySelector('.task-time-from')?.value;
                const tt = item.querySelector('.task-time-to')?.value;
                const pt = item.querySelector('.print-task-time');
                if (pt) {
                    if (tf || tt) pt.textContent = `[वेळ: ${tf || '--'} ते ${tt || '--'}]`;
                    else pt.textContent = '';
                }
            });
        }
    }

    function getStorageKey() { 
        return `DAINANDINI_V4_${document.getElementById('monthSelect').value}_${document.getElementById('yearSelect').value}`; 
    }

    function handleFormChange(elem) {
        if (elem && elem.closest('tr')) syncRowVisuals(elem.closest('tr'));
        saveToLocalStorage();
        updateSyncBadge("स्थानिक ड्राफ्ट सेव्ह झाला", "synced");
        if (verifiedSessionPin && isAutoSyncEnabled) {
            clearTimeout(autoSyncTimer);
            updateSyncBadge("ऑटो-सिंक प्रलंबित...", "syncing");
            autoSyncTimer = setTimeout(() => syncToGoogleSheets(verifiedSessionPin, true), 3000);
        }
    }

    function saveToLocalStorage() {
        const entries = [];
        document.querySelectorAll('#tableBody tr').forEach(row => {
            const isHol = row.getAttribute('data-is-holiday') === 'true';
            let entry = {
                day: row.getAttribute('data-day-index'), 
                isHoliday: isHol,
                holidayReason: isHol ? (row.querySelector('.holiday-reason-input') ? row.querySelector('.holiday-reason-input').value : '') : '',
                cbWhole: isHol ? true : row.querySelector('.cb-whole').checked,
                cbMorning: isHol ? false : row.querySelector('.cb-morning').checked,
                cbAfternoon: isHol ? false : row.querySelector('.cb-afternoon').checked,
                morningTasks: [], afternoonTasks: []
            };

            if (!isHol) {
                const getTaskData = (block) => {
                    let taskArr = [];
                    let pNodes = row.querySelectorAll(`.col-planned ${block} .task-item`);
                    let aNodes = row.querySelectorAll(`.col-actual ${block} .task-item`);
                    let wNodes = row.querySelectorAll(`.col-work ${block} .task-item`);
                    let rNodes = row.querySelectorAll(`.col-remarks ${block} .task-item`);
                    
                    for(let i=0; i<pNodes.length; i++) {
                        taskArr.push({
                            timeFrom: pNodes[i].querySelector('.task-time-from')?.value || '',
                            timeTo: pNodes[i].querySelector('.task-time-to')?.value || '',
                            planned: pNodes[i].querySelector('.input-planned')?.value || '',
                            actualTimeFrom: aNodes[i]?.querySelector('.task-time-from')?.value || '',
                            actualTimeTo: aNodes[i]?.querySelector('.task-time-to')?.value || '',
                            actual: aNodes[i]?.querySelector('.input-actual')?.value || '',
                            work: wNodes[i]?.querySelector('.input-work')?.value || '',
                            remarks: rNodes[i]?.querySelector('.input-remarks')?.value || ''
                        });
                    }
                    return taskArr;
                };

                entry.morningTasks = getTaskData('.morning-block');
                entry.afternoonTasks = getTaskData('.afternoon-block');
            }
            entries.push(entry);
        });
        localStorage.setItem(getStorageKey(), JSON.stringify({
            kendraPramukhName: document.getElementById('kendraPramukhNameInput').value,
            kendra: document.getElementById('kendraInput').value,
            taluka: document.getElementById('talukaInput').value, jilha: document.getElementById('jilhaInput').value,
            entries: entries
        }));
    }

    function loadFormData() {
        generateTableStructure();
        const saved = localStorage.getItem(getStorageKey());
        if (!saved) return;
        
        try {
            const data = JSON.parse(saved);
            if (data.kendraPramukhName) document.getElementById('kendraPramukhNameInput').value = data.kendraPramukhName;
            if (data.kendra) document.getElementById('kendraInput').value = data.kendra;
            if (data.taluka) document.getElementById('talukaInput').value = data.taluka;
            if (data.jilha) document.getElementById('jilhaInput').value = data.jilha;

            const m = parseInt(document.getElementById('monthSelect').value), y = parseInt(document.getElementById('yearSelect').value);

            data.entries.forEach(item => {
                const row = document.querySelector(`#tableBody tr[data-day-index="${item.day}"]`);
                if (!row) return;
                
                let isSun = row.getAttribute('data-is-sunday') === 'true';
                let dt = new Date(y, m, parseInt(item.day));
                let dtText = `${item.day} ${monthsMarathi[m]} <span class="no-print">${y}</span> <b>(${daysMarathi[dt.getDay()]})</b>`;

                if (item.isHoliday) {
                    renderHolidayRow(row, item.day, dtText, item.holidayReason || (isSun ? "सार्वजनिक सुट्टी (रविवार)" : "सुट्टी"), isSun);
                } else {
                    renderNormalRow(row, item.day, dtText);
                    
                    if (item.cbWhole !== undefined) {
                        row.querySelector('.cb-whole').checked = item.cbWhole;
                        row.querySelector('.cb-morning').checked = item.cbMorning;
                        row.querySelector('.cb-afternoon').checked = item.cbAfternoon;
                    }
                    
                    ['morning', 'afternoon'].forEach(sType => {
                        let taskArr = sType === 'morning' ? item.morningTasks : item.afternoonTasks;
                        if (taskArr && taskArr.length > 0) {
                            const bCls = sType === 'morning' ? '.morning-block' : '.afternoon-block';
                            ['planned','actual','work','remarks'].forEach(c => row.querySelector(`.col-${c} ${bCls} .task-list`).innerHTML = '');
                            
                            taskArr.forEach((tData, idx) => {
                                addTaskToDOM(row, sType);
                                row.querySelectorAll(`.col-planned ${bCls} .task-time-from`)[idx].value = tData.timeFrom || '';
                                row.querySelectorAll(`.col-planned ${bCls} .task-time-to`)[idx].value = tData.timeTo || '';
                                row.querySelectorAll(`.col-planned ${bCls} .input-planned`)[idx].value = tData.planned || '';
                                
                                let actualTf = row.querySelectorAll(`.col-actual ${bCls} .task-time-from`)[idx];
                                if(actualTf) actualTf.value = tData.actualTimeFrom || '';
                                let actualTt = row.querySelectorAll(`.col-actual ${bCls} .task-time-to`)[idx];
                                if(actualTt) actualTt.value = tData.actualTimeTo || '';

                                row.querySelectorAll(`.col-actual ${bCls} .input-actual`)[idx].value = tData.actual || '';
                                row.querySelectorAll(`.col-work ${bCls} .input-work`)[idx].value = tData.work || '';
                                row.querySelectorAll(`.col-remarks ${bCls} .input-remarks`)[idx].value = tData.remarks || '';
                            });
                        }
                    });
                    
                    updateRowSessionUI(row);
                }
                syncRowVisuals(row);
            });
        } catch(e) { console.error("Load error:", e); }
    }

    function onMonthYearChange() { loadFormData(); }
    function updateSyncBadge(t, c) { document.getElementById('syncStatus').textContent = t; document.getElementById('syncStatus').className = `sync-badge ${c}`; }
    function prepareAndPrint() { document.querySelectorAll('#tableBody tr').forEach(row => syncRowVisuals(row)); window.print(); }
    
    async function syncToGoogleSheets(pinToUse, isAuto = false) {
        if (!isAuto) updateSyncBadge("ऑनलाइन सेव्ह होत आहे...", "syncing");
        
        let entries = [];
        document.querySelectorAll('#tableBody tr').forEach(row => {
            let dayIndex = row.getAttribute('data-day-index');
            let isHol = row.getAttribute('data-is-holiday') === 'true';
            
            let sMode = '', p = '', a = '', w = '', r = '', hR = '';

            if (isHol) {
                hR = row.querySelector('.holiday-reason-input') ? row.querySelector('.holiday-reason-input').value.trim() : "सार्वजनिक सुट्टी";
                p = hR; a = hR; w = hR; r = "सुट्टी"; sMode = "सुट्टी";
            } else {
                let cbW = row.querySelector('.cb-whole').checked;
                let cbM = row.querySelector('.cb-morning').checked;
                let cbA = row.querySelector('.cb-afternoon').checked;
                sMode = cbW ? 'पूर्ण दिवस' : ((cbM && cbA) ? 'सकाळ व दुपार' : (cbM ? 'सकाळ सत्र' : 'दुपार सत्र'));

                const extractTaskData = (blockCls) => {
                    let tasks = [];
                    let rows = Array.from(row.querySelectorAll(`.col-planned ${blockCls} .task-item`));
                    rows.forEach((item, i) => {
                       let tf = item.querySelector('.task-time-from')?.value || '';
                       let tt = item.querySelector('.task-time-to')?.value || '';
                       
                       let actualNode = row.querySelectorAll(`.col-actual ${blockCls} .task-item`)[i];
                       let atf = actualNode?.querySelector('.task-time-from')?.value || '';
                       let att = actualNode?.querySelector('.task-time-to')?.value || '';

                       let pVal = item.querySelector('.input-planned')?.value.trim() || '';
                       let aVal = actualNode?.querySelector('.input-actual')?.value.trim() || '';
                       let wVal = row.querySelectorAll(`.col-work ${blockCls} .input-work`)[i]?.value.trim() || '';
                       let rVal = row.querySelectorAll(`.col-remarks ${blockCls} .input-remarks`)[i]?.value.trim() || '';
                       
                       if(pVal || aVal || wVal || rVal) tasks.push({tf, tt, atf, att, p:pVal, a:aVal, w:wVal, r:rVal});
                    });
                    return tasks;
                };
                
                let tM = (cbM || cbW) ? extractTaskData('.morning-block') : [];
                let tA = cbA ? extractTaskData('.afternoon-block') : [];

                const formatCol = (arr, key, includeTime) => {
                    return arr.map((t, i) => {
                        let pref = arr.length > 1 ? `${i+1}) ` : ``;
                        let timeStr = ``;
                        if (includeTime) {
                            if (key === 'p' && (t.tf || t.tt)) timeStr = `[${t.tf||'--'} ते ${t.tt||'--'}] `;
                            if (key === 'a' && (t.atf || t.att)) timeStr = `[${t.atf||'--'} ते ${t.att||'--'}] `;
                        }
                        let val = t[key];
                        return val ? `${pref}${timeStr}${val}`.trim() : ``;
                    }).filter(v=>v).join('\n');
                };

                const buildText = (arrM, arrA, key, includeTime) => {
                    let textM = formatCol(arrM, key, includeTime);
                    let textA = formatCol(arrA, key, includeTime);
                    if(cbM && cbA) return (textM ? `सकाळ:\n${textM}` : "") + (textM && textA ? "\n\n" : "") + (textA ? `दुपार:\n${textA}` : "");
                    return textM || textA;
                };

                p = buildText(tM, tA, 'p', true);  
                a = buildText(tM, tA, 'a', true);
                w = buildText(tM, tA, 'w', false);
                r = buildText(tM, tA, 'r', false);
            }
            
            if (p || a || w || r || sMode) {
                entries.push({ day: dayIndex, date: row.getAttribute('data-date'), isHoliday: isHol, holidayReason: hR,
                               fromTime: '', toTime: '', session: sMode, timing: '', planned: p, actual: a, work: w, remarks: r });
            }
        });

        let payload = {
            action: "syncData", pin: pinToUse, 
            month: document.getElementById('monthSelect').options[document.getElementById('monthSelect').selectedIndex].text,
            year: document.getElementById('yearSelect').value,
            data: {
                kendraPramukhName: document.getElementById('kendraPramukhNameInput').value.trim(),
                kendra: document.getElementById('kendraInput').value.trim(),
                taluka: document.getElementById('talukaInput').value.trim(),
                jilha: document.getElementById('jilhaInput').value.trim(),
                entries: entries
            }
        };

        try {
            let res = await fetch(GOOGLE_WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) }).then(r=>r.json());
            if (res.status === 'success') {
                updateSyncBadge(`ऑनलाइन सिंक पूर्ण`, "synced");
                if (!isAuto) alert("माहिती Google Sheets मध्ये सेव्ह झाली!");
            } else {
                updateSyncBadge("सिंक अयशस्वी", ""); if (!isAuto) alert("त्रुटी: " + res.message);
            }
        } catch (error) { updateSyncBadge("ऑफलाइन मोड", ""); if (!isAuto) alert("सर्व्हरशी संपर्क होऊ शकला नाही."); }
    }

    function openAdminPanel() { document.getElementById('adminModal').style.display = 'flex'; if (verifiedSessionPin) showAdminControls(); else showAdminLogin(); }
    function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; }
    function showAdminLogin() { document.getElementById('loginStep').style.display = 'block'; document.getElementById('adminControlsStep').style.display = 'none'; document.getElementById('authPinInput').value = ''; }
    function showAdminControls() { document.getElementById('loginStep').style.display = 'none'; document.getElementById('adminControlsStep').style.display = 'block'; }
    function logoutAdmin() { verifiedSessionPin = ""; sessionStorage.removeItem('KP_ADMIN_PIN'); clearTimeout(autoSyncTimer); updateSyncBadge("लॉगआउट केले", ""); alert("यशस्वीरित्या लॉगआउट."); showAdminLogin(); }
    function toggleAutoSync() { isAutoSyncEnabled = document.getElementById('autoSyncToggle').checked; localStorage.setItem('KP_AUTOSYNC', isAutoSyncEnabled); updateSyncBadge(isAutoSyncEnabled ? "ऑटो-सिंक चालू" : "ऑटो-सिंक बंद", isAutoSyncEnabled ? "synced" : ""); }
    function triggerManualSync() { if (!verifiedSessionPin) return alert("लॉगिन करा!"); syncToGoogleSheets(verifiedSessionPin); }
    
    async function verifyAdminLogin() {
        const pin = document.getElementById('authPinInput').value.trim(); if (!pin) return alert("PIN टाका!");
        updateSyncBadge("पडताळणी सुरू...", "syncing");
        try {
            let res = await fetch(GOOGLE_WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "verifyPin", pin: pin }) }).then(r => r.json());
            if (res.status === 'success') { verifiedSessionPin = pin; sessionStorage.setItem('KP_ADMIN_PIN', pin); showAdminControls(); updateSyncBadge("लॉगिन यशस्वी", "synced"); }
            else { alert("चुकीचा PIN!"); updateSyncBadge("चुकीचा PIN", ""); }
        } catch (err) { verifiedSessionPin = pin; sessionStorage.setItem('KP_ADMIN_PIN', pin); showAdminControls(); } 
    }

    async function fetchFromGoogleSheets() {
        if (!verifiedSessionPin) return alert("लॉगिन करा!");
        updateSyncBadge("डेटा मिळवत आहे...", "syncing");
        try {
            let month = document.getElementById('monthSelect').options[document.getElementById('monthSelect').selectedIndex].text;
            let year = document.getElementById('yearSelect').value;
            let res = await fetch(GOOGLE_WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "fetchData", pin: verifiedSessionPin, month: month, year: year }) }).then(r => r.json());
            if (res.status === 'success' && res.data) { localStorage.setItem(getStorageKey(), JSON.stringify(res.data)); loadFormData(); updateSyncBadge("डेटा मिळवला", "synced"); alert("ऑनलाइन डेटा अपडेट केला!"); closeAdminModal(); }
            else { updateSyncBadge("डेटा मिळाला नाही", ""); alert("त्रुटी: " + (res.message || "डेटा नाही.")); }
        } catch (err) { updateSyncBadge("ऑफलाइन मोड", ""); alert("सर्व्हरशी संपर्क नाही."); }
    }

    async function deleteFromGoogleSheets() {
        if (!verifiedSessionPin) return alert("लॉगिन करा!");
        let month = document.getElementById('monthSelect').options[document.getElementById('monthSelect').selectedIndex].text; let year = document.getElementById('yearSelect').value;
        if (!confirm(`${month} ${year} चा ऑनलाइन डेटा कायमचा डिलीट करायचा आहे का?`)) return;
        updateSyncBadge("डेटा डिलीट करत आहे...", "syncing");
        try {
            let res = await fetch(GOOGLE_WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "deleteData", pin: verifiedSessionPin, month: month, year: year }) }).then(r => r.json());
            if (res.status === 'success') {
                updateSyncBadge("डेटा डिलीट झाला", "synced"); alert(`ऑनलाइन डेटा डिलीट झाला!`);
                if (confirm("स्थानिक (Local) ड्राफ्ट पण डिलीट करायचा आहे का?")) { localStorage.removeItem(getStorageKey()); loadFormData(); } closeAdminModal();
            } else { updateSyncBadge("डिलीट अयशस्वी", ""); alert("त्रुटी: " + res.message); }
        } catch (err) { updateSyncBadge("ऑफलाइन मोड", ""); alert("सर्व्हरशी संपर्क नाही."); }
    }
    
    function clearLocalStorageDraft() {
        let m = document.getElementById('monthSelect').options[document.getElementById('monthSelect').selectedIndex].text, y = document.getElementById('yearSelect').value;
        if (confirm(`खात्री आहे का? केवळ या डिव्हाइसवरील ${m} ${y} चा ड्राफ्ट हटवला जाईल.`)) { localStorage.removeItem(getStorageKey()); loadFormData(); updateSyncBadge("ड्राफ्ट हटवला", ""); }
    }

    async function saveNewPinOnline() {
        const newPin = document.getElementById('newPin').value.trim(), confirmNewPin = document.getElementById('confirmNewPin').value.trim();
        if (!newPin || !confirmNewPin) return alert("सर्व पर्याय भरा!");
        if (newPin !== confirmNewPin) return alert("PIN जुळत नाहीत!");
        updateSyncBadge("PIN बदलत आहे...", "syncing");
        try {
            let res = await fetch(GOOGLE_WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "changePin", currentPin: verifiedSessionPin, newPin: newPin }) }).then(r => r.json());
            if (res.status === 'success') { alert("PIN बदलला!"); verifiedSessionPin = newPin; sessionStorage.setItem('KP_ADMIN_PIN', newPin); document.getElementById('newPin').value = ''; document.getElementById('confirmNewPin').value = ''; updateSyncBadge("PIN अपडेट झाला", "synced"); }
            else { alert("त्रुटी: " + res.message); }
        } catch (e) { alert("सर्व्हर संपर्क तुटला."); }
    }

    window.onload = initDates;
</script>
