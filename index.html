<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>समूह साधन केंद्र समन्वयक मासिक दैनंदिनी</title>
    <!-- Google Font Mukta Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #003366; 
            --accent-color: #0369a1; 
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --border-color: #94a3b8;
            --holiday-bg: #fee2e2; 
            --holiday-color: #991b1b; 
            --holiday-border: #f87171;
            --holiday-shera-bg: #fca5a5;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Mukta', system-ui, -apple-system, sans-serif;
            margin: 0; padding: 10px; background-color: var(--bg-color); color: var(--text-color);
            line-height: 1.35; -webkit-tap-highlight-color: transparent;
        }
        .container {
            max-width: 1250px; margin: 0 auto; background: #ffffff; padding: 12px;
            border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #cbd5e1;
        }

        .header-section {
            text-align: center; background-color: var(--primary-color); color: #ffffff;
            padding: 10px 8px; border-radius: 4px 4px 0 0; margin-bottom: 8px;
            border-bottom: 3px solid var(--accent-color);
        }
        .header-section h1 { margin: 0; font-size: clamp(18px, 2.5vw, 24px); font-weight: 800; letter-spacing: 0.5px; }
        
        /* Visually Divided Header Subsections */
        .header-wrapper { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        
        .header-subsection { 
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; 
            background: #f0f9ff; border: 1px solid var(--accent-color); border-radius: 4px; 
            padding: 10px 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); 
        }
        
        .info-item {
            display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--primary-color); font-size: 16px; white-space: nowrap; justify-content: center;
        }
        .info-item label { margin: 0; padding: 0; cursor: pointer; }
        
        .stylish-select-box { display: inline-flex; align-items: center; background: #ffffff; border: 1px solid var(--border-color); border-radius: 2px; padding: 1px 4px; }
        .stylish-select-box select { font-family: inherit; font-size: 16px; font-weight: 700; color: var(--primary-color); background: transparent; border: none; outline: none; padding: 2px 4px; cursor: pointer; text-align: center; }
        
        .editable-header-input { font-family: inherit; font-size: 16px; padding: 2px 6px; font-weight: 700; border: 1px solid var(--border-color); border-radius: 2px; background: #ffffff; text-align: center; color: #111827; }
        .name-input { width: 220px; }
        .loc-input { width: 140px; }

        .sync-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 10px; border-radius: 2px; background: #e0f2fe; color: var(--primary-color); font-weight: 700; margin: 0 auto; width: fit-content; border: 1px solid #7dd3fc; }
        .sync-badge.synced { background: #f8fafc; color: #0f172a; border-color: #94a3b8; }
        .sync-badge.syncing { background: #fef9c3; color: #854d0e; border-color: #fde047; }

        /* Table & Row Compact Styling */
        table { width: 100%; border-collapse: collapse; margin-top: 6px; table-layout: fixed; }
        th, td { border: 1px solid var(--primary-color); padding: 4px 3px; text-align: center; vertical-align: middle; font-size: 15px; font-weight: 500; }
        th { background-color: #e0f2fe; color: var(--primary-color); font-weight: 800; font-size: 16px; padding: 6px 3px; vertical-align: middle; border-bottom: 2px solid var(--primary-color); }
        
        /* height: 1px is a CSS trick to allow inner flex elements to stretch exactly 100% of dynamically changing td height */
        td.p-0 { padding: 0 !important; vertical-align: middle; height: 1px; }
        .td-content { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-height: 100%; width: 100%; }
        
        .morning-block, .afternoon-block, .morning-label-box, .afternoon-label-box { display: none; }
        
        /* Perfect Vertical Centering Rules */
        .mode-whole .morning-block { display: flex; flex-direction: column; height: 100%; flex: 1; justify-content: center; }
        .mode-whole .morning-label-box, .mode-whole .afternoon-label-box { display: none !important; }
        
        .mode-morning .morning-block, .mode-morning .morning-label-box { display: flex; flex-direction: column; height: 100%; flex: 1; justify-content: center; }
        .mode-afternoon .afternoon-block, .mode-afternoon .afternoon-label-box { display: flex; flex-direction: column; height: 100%; flex: 1; justify-content: center; }
        .mode-both .morning-block, .mode-both .afternoon-block, .mode-both .morning-label-box, .mode-both .afternoon-label-box { display: flex; flex-direction: column; flex: 1; justify-content: center; }

        .mode-both .morning-block, .mode-both .morning-label-box {
            border-bottom: 1.5px dotted var(--primary-color) !important;
        }

        /* Compact center-aligned textareas & selects */
        textarea { 
            width: 100%; 
            min-height: 40px; 
            border: 1px solid var(--border-color); 
            border-radius: 2px; 
            font-family: inherit; 
            font-size: 15px; 
            font-weight: 600;
            padding: 3px 4px; 
            resize: none; 
            text-align: center; 
            white-space: pre-wrap;
            word-break: break-word;
            overflow: hidden; 
            line-height: 1.25;
            margin: auto 0; /* Additional nudge for absolute vertical centering */
        }
        .school-select { 
            width: 100%; 
            padding: 2px 4px; 
            font-size: 14px; 
            font-family: inherit; 
            border-radius: 2px; 
            border: 1px solid var(--border-color); 
            background: #ffffff; 
            text-align: center; 
            text-align-last: center; 
            margin-bottom: 2px; 
            font-weight: 700;
        }

        .task-list { display: flex; flex-direction: column; width: 100%; align-items: center; justify-content: center; height: 100%; flex: 1; }
        .task-item { 
            border-bottom: 1px dotted var(--primary-color); 
            padding: 4px 2px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            width: 100%;
            text-align: center;
            flex: 1; /* Key for vertical centering inside varying heights */
        }
        .task-item:last-child { border-bottom: none; }

        .session-setup-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px; height: 100%; flex: 1; }
        .session-box { display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: center; margin: 0; width: 100%; background: #ffffff; border: 1px solid var(--border-color); border-radius: 2px; padding: 2px 4px; font-size: 12px; gap: 4px; font-weight: 700; }
        .session-box label { display: flex; align-items: center; gap: 3px; cursor: pointer; margin: 0; color: var(--primary-color); font-weight: 700; }

        .add-btn-group { display: flex; flex-direction: row; flex-wrap: wrap; gap: 3px; margin-top: 0; align-items: center; justify-content: center; }
        .task-btn { font-family: inherit; font-size: 11px; padding: 2px 6px; border: 1px solid; border-radius: 2px; font-weight: 700; cursor: pointer; display: none; width: auto; background: #f8fafc; color: var(--primary-color); border-color: var(--border-color); }
        .task-btn:hover { background: #e2e8f0; }

        .holiday-toggle-wrapper { margin-top: 0; font-size: 11px; display: flex; align-items: center; justify-content: center; gap: 3px; cursor: pointer; color: var(--holiday-color); font-weight: 700; background: var(--holiday-bg); padding: 2px 4px; border: 1px solid var(--holiday-border); border-radius: 2px; }

        .task-timing { display: flex; gap: 2px; margin-bottom: 2px; justify-content: center; align-items: center; background: #ffffff; padding: 1px 2px; border: 1px solid #cbd5e1; width: 100%; }
        .task-time-from, .task-time-to { width: 68px; font-size: 12px; font-weight: 700; padding: 1px; border: 1px solid #cbd5e1; border-radius: 2px; font-family: inherit; text-align: center; }
        
        /* Holiday Row Full Colour */
        tr.holiday-row td { 
            background-color: var(--holiday-bg) !important; 
            color: var(--holiday-color) !important;
            border-color: var(--holiday-border) !important;
            padding: 8px 4px !important;
        }

        .holiday-full-row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; width: 100%; height: 100%; }
        .holiday-icon-label { font-size: 16px; font-weight: 800; color: var(--holiday-color); background: var(--holiday-shera-bg); padding: 3px 12px; border-radius: 4px; border: 1px solid var(--holiday-border); letter-spacing: 0.5px; }

        .holiday-badge { 
            display: inline-block; 
            background: #fecaca; 
            color: var(--holiday-color); 
            padding: 2px 6px; 
            border: 1px solid var(--holiday-border); 
            font-size: 12px; 
            font-weight: 800; 
            border-radius: 3px; 
        }
        .holiday-input-container { padding: 6px !important; text-align: center; vertical-align: middle; }
        .holiday-input-container input { 
            width: 90%; 
            max-width: 500px; 
            padding: 4px 8px; 
            font-family: inherit; 
            font-size: 16px; 
            font-weight: 800; 
            color: var(--holiday-color); 
            border: 1px solid var(--holiday-border); 
            text-align: center; 
            background: #ffffff; 
            border-radius: 4px;
        }

        .date-text-print { font-size: 15px; font-weight: 700; line-height: 1.2; text-align: center; }

        .btn-container { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
        button.action-btn { width: 100%; padding: 8px 16px; font-size: 15px; font-family: inherit; font-weight: 700; cursor: pointer; border: 1px solid var(--primary-color); border-radius: 2px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-print { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }
        .btn-print:hover { background-color: #001a33; }
        .btn-admin { background-color: #e2e8f0; color: var(--text-color); }
        .btn-sync { background-color: var(--accent-color); color: white; border-color: var(--accent-color); }
        .btn-fetch { background-color: #e0f2fe; color: var(--primary-color); border-color: #7dd3fc; }
        .btn-danger { background-color: #ffffff; color: #dc2626; border-color: #dc2626; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); justify-content: center; align-items: center; padding: 14px; }
        .modal-content { background-color: white; padding: 18px; border-radius: 4px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; text-align: left; border: 1px solid var(--primary-color); font-family: inherit; }
        .modal-content h3 { margin: 0 0 10px 0; color: var(--primary-color); border-bottom: 1px solid var(--border-color); padding-bottom: 6px; text-align: center; font-size: 17px; font-weight: 800;}
        .modal-content label { display: block; margin-top: 8px; font-weight: 700; font-size: 14px; }
        .modal-content input[type="password"] { width: 100%; padding: 6px; margin-top: 3px; border: 1px solid var(--border-color); border-radius: 2px; font-size: 14px; font-family: inherit; }
        .modal-actions { margin-top: 14px; display: flex; gap: 8px; }
        .danger-zone { margin-top: 12px; padding: 10px; border: 1px solid #94a3b8; background-color: #f8fafc; }
        .danger-zone h4 { margin: 0 0 8px 0; color: var(--text-color); font-size: 14px; text-align: center; font-weight: 700; }
        
        .switch-container { display: flex; align-items: center; justify-content: space-between; background: #f8fafc; padding: 8px 12px; border: 1px solid var(--border-color); margin-bottom: 12px; }
        .switch-container span { font-weight: 700; font-size: 14px; color: var(--text-color); }
        .switch { position: relative; display: inline-block; width: 36px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(18px); }

        .print-text { 
            display: none; 
            white-space: pre-wrap; 
            word-break: break-word; 
            text-align: center; 
            width: 100%;
            font-weight: 600;
            line-height: 1.25;
            justify-content: center;
            align-items: center;
            margin: auto 0; /* Push text to middle in print view */
        }
        
        /* Dedicated print block for Holidays to prevent cutoff */
        .holiday-print-text {
            font-size: 16px;
            font-weight: 800;
            color: var(--holiday-color);
            text-align: center;
            width: 100%;
        }

        .print-task-time { 
            display: none; 
            font-size: 10pt; 
            font-weight: 700; 
            color: var(--text-color); 
            margin-bottom: 2px; 
            text-align: center; 
            width: 100%;
        }

        @media screen and (min-width: 769px) {
            .btn-container { flex-direction: row; justify-content: center; }
            button.action-btn { width: auto; }
        }

        /* ================= MOBILE / ADAPTIVE CARD LAYOUT ================= */
        @media screen and (max-width: 768px) {
            body { padding: 6px; }
            .container { padding: 6px; border-radius: 6px; }
            .header-section { padding: 8px 6px; }
            .header-section h1 { font-size: 16px; }
            
            .header-subsection { flex-direction: column; gap: 8px; justify-content: center; align-items: center; padding: 10px; }
            .info-item { font-size: 14px; gap: 4px; justify-content: center; width: auto; }
            .editable-header-input { font-size: 14px; padding: 3px 5px; }
            .name-input { width: 100%; max-width: 250px; }
            .loc-input { width: 100%; max-width: 150px; }
            .stylish-select-box select { font-size: 14px; }

            table, thead, tbody, tr { display: block; width: 100%; }
            thead { display: none; }
            table { border: none; margin-top: 4px; }

            tbody tr {
                display: block;
                margin-bottom: 12px;
                border: 1.5px solid var(--primary-color);
                border-radius: 6px;
                overflow: hidden;
                background: #fff;
                box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            }
            tbody tr.holiday-row { border-color: var(--holiday-border); }

            td, td.p-0 {
                display: flex !important;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                width: 100% !important;
                border: none;
                border-bottom: 1px dashed #cbd5e1;
                padding: 6px 8px !important;
                text-align: center;
                height: auto; /* Reset hack for mobile card view */
            }
            td:last-child { border-bottom: none; }

            td.date-cell-mobile { background: var(--primary-color); padding: 6px 8px !important; text-align: center; }
            td.date-cell-mobile .date-text-print { color: #fff; font-size: 14px; text-align: center; }
            tr.holiday-row td.date-cell-mobile { background: var(--holiday-color) !important; }

            td[data-label]::before {
                content: attr(data-label);
                display: block;
                font-size: 11px;
                font-weight: 800;
                color: var(--primary-color);
                background: #e0f2fe;
                margin: -6px -8px 6px -8px;
                padding: 3px 8px;
                text-align: center;
                width: calc(100% + 16px);
            }
            tr.holiday-row td[data-label]::before { color: var(--holiday-color); background: #fecaca; }

            .session-setup-wrapper { padding: 2px; }
            .task-timing { flex-wrap: wrap; justify-content: center; }
            .task-time-from, .task-time-to { flex: 1 1 45%; width: auto; min-width: 70px; }
            .holiday-full-row { flex-direction: column; gap: 8px; justify-content: center; }
            .holiday-input-container input { width: 100%; font-size: 14px; }

            .btn-container button.action-btn { font-size: 14px; padding: 10px 12px; }
        }
        /* =================================================================== */

        @media print {
            @page { size: A4 portrait; margin: 5mm 4mm; }

            body { background: #ffffff !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; font-size: 9.5pt; line-height: 1.15 !important; color: var(--text-color) !important; font-family: 'Mukta', sans-serif !important; }
            .container { box-shadow: none !important; padding: 0 !important; border: none !important; }

            .header-section { display: block !important; padding: 3px !important; margin: 0 0 3px 0 !important; border: 1px solid var(--primary-color) !important; border-radius: 0 !important; background: var(--primary-color) !important; color: #ffffff !important; }
            .header-section h1 { font-size: 13pt !important; color: #ffffff !important; font-weight: 800 !important; }
            
            .header-wrapper { gap: 4px !important; margin-bottom: 6px !important; flex-direction: column !important; }
            .header-subsection { 
                padding: 4px 6px !important; border: 1px solid var(--primary-color) !important; border-radius: 0 !important; 
                background: transparent !important; box-shadow: none !important; margin: 0 !important; 
                justify-content: space-between !important;
            }
            
            .info-item { color: var(--primary-color) !important; font-size: 11pt !important; gap: 3px !important; }
            .stylish-select-box select, .editable-header-input { border: none !important; background: transparent !important; padding: 0 !important; -webkit-appearance: none; color: var(--primary-color) !important; font-weight: 800; font-size: 11pt !important; text-align: left !important; }
            .stylish-select-box { border: none !important; padding: 0 !important; }
            .name-input { width: auto !important; min-width: 150px !important; }
            .loc-input { width: auto !important; min-width: 80px !important; }

            .no-print, .sync-badge, select.school-select, .holiday-toggle-wrapper, .timing-wrapper, .session-box, .add-btn-group, .task-btn, .remove-task-btn, .task-timing { display: none !important; }

            /* Force real table layout in print, overriding the mobile card view */
            table, thead, tbody, tr { display: revert !important; }
            table { font-size: 9.5pt !important; border-collapse: collapse !important; width: 100% !important; border: 1px solid var(--primary-color) !important; table-layout: fixed !important; }
            thead { display: table-header-group !important; }
            tbody { display: table-row-group !important; }
            tr { display: table-row !important; page-break-inside: avoid !important; }

            th, td { display: table-cell !important; padding: 2px 2px !important; border: 1px solid var(--primary-color) !important; vertical-align: middle !important; text-align: center !important; }
            
            /* Print vertical centering overrides */
            td.p-0 { padding: 0 !important; vertical-align: middle !important; height: auto !important; }
            .td-content { display: flex !important; flex-direction: column !important; justify-content: center !important; align-items: center !important; height: 100% !important; }

            /* Reset mobile card affordances so nothing leaks into print */
            td[data-label]::before { content: none !important; }
            td { margin: 0 !important; }
            td.date-cell-mobile { background: transparent !important; text-align: center !important; }
            td.date-cell-mobile .date-text-print { color: var(--primary-color) !important; }

            .date-cell-mobile { vertical-align: middle !important; text-align: center !important; }
            .mode-both .morning-block, .mode-both .morning-label-box { border-bottom: 1.5px dotted var(--primary-color) !important; }
            .morning-label-box > div, .afternoon-label-box > div { background: #e0f2fe !important; color: var(--primary-color) !important; border: 1px solid var(--primary-color) !important; padding: 1px !important; border-radius: 2px !important; font-size: 8.5pt !important; font-weight: 800 !important; text-align: center !important; }
            
            .date-text-print { font-weight: 800 !important; color: var(--primary-color) !important; font-size: 10pt !important; text-align: center !important; }

            /* Holiday row logic for print wrapping */
            tr.holiday-row td { background-color: var(--holiday-bg) !important; border-color: var(--holiday-border) !important; color: var(--holiday-color) !important; padding: 2px 2px !important; }
            .holiday-badge { background: transparent !important; color: var(--holiday-color) !important; font-weight: 800; border: none !important; padding: 0 !important; font-size: 8.5pt !important; }
            .holiday-input-container { text-align: center !important; vertical-align: middle !important; padding: 2px !important; }
            .holiday-full-row { display: flex !important; flex-direction: row !important; justify-content: center !important; align-items: center !important; gap: 6px !important; }
            .holiday-icon-label { background: transparent !important; border: none !important; font-size: 10pt !important; font-weight: 800 !important; color: var(--holiday-color) !important; padding: 0 !important; }
            
            .holiday-reason-input { display: none !important; }
            .holiday-print-text { display: flex !important; align-items: center !important; justify-content: center !important; font-size: 11pt !important; margin: auto 0 !important; }

            textarea { display: none !important; }
            
            .task-item { border-bottom: 1px dotted var(--primary-color) !important; padding: 1px 1px !important; text-align: center !important; justify-content: center !important; align-items: center !important; min-height: 0 !important; flex: 1 !important;}
            .task-item:last-child { border-bottom: none !important; }
            
            .print-text { display: flex !important; flex-direction: column !important; justify-content: center !important; align-items: center !important; font-size: 9.5pt !important; font-weight: 600 !important; padding: 0 !important; text-align: center !important; color: var(--text-color) !important; white-space: pre-wrap !important; word-break: break-word !important; }
            .print-task-time { display: block !important; font-size: 8.5pt !important; font-weight: 800 !important; color: var(--primary-color) !important; background: transparent !important; padding: 0 !important; margin-bottom: 1px !important; text-align: center !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1>समूह साधन केंद्र समन्वयक मासिक दैनंदिनी</h1>
    </div>

    <!-- Visually Divided Header Subsections -->
    <div class="header-wrapper">
        <div class="header-subsection">
            <div class="info-item">
                <label>महिना व वर्ष:</label>
                <div class="stylish-select-box"><select id="monthSelect" onchange="onMonthYearChange()"></select></div>
                <div class="stylish-select-box"><select id="yearSelect" onchange="onMonthYearChange()"></select></div>
            </div>
            <div class="info-item">
                <label>केंद्रप्रमुख नाव:</label>
                <input type="text" id="kendraPramukhNameInput" class="editable-header-input name-input" value="श्री. / सौ. " oninput="handleFormChange()">
            </div>
        </div>
        <div class="header-subsection">
            <div class="info-item">
                <label>केंद्र:</label>
                <input type="text" id="kendraInput" class="editable-header-input loc-input" value="रविवार पेठ" oninput="handleFormChange()">
            </div>
            <div class="info-item">
                <label>तालुका:</label>
                <input type="text" id="talukaInput" class="editable-header-input loc-input" value="अंबाजोगाई" oninput="handleFormChange()">
            </div>
            <div class="info-item">
                <label>जिल्हा:</label>
                <input type="text" id="jilhaInput" class="editable-header-input loc-input" value="बीड" oninput="handleFormChange()">
            </div>
        </div>
    </div>

    <div style="text-align:center; margin-bottom: 6px;" class="no-print">
        <div id="syncStatus" class="sync-badge">स्थानिक ड्राफ्ट सक्रिय</div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 13%;">दिनांक व वार</th>
                <th style="width: 15%;">सत्र / स्वरूप</th>
                <th style="width: 24%;">नियोजित भेट</th>
                <th style="width: 24%;">प्रत्यक्ष भेट</th>
                <th style="width: 24%;">कामाचे स्वरूप</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <div class="btn-container no-print">
        <button class="action-btn btn-print" onclick="prepareAndPrint()">PDF डाउनलोड करा / प्रिंट करा</button>
        <button class="action-btn btn-admin" onclick="openAdminPanel()">केंद्रप्रमुख पॅनेल (सिंक व सेटिंग्ज)</button>
    </div>
</div>

            <p style="font-size: 15px; color: #15803d; font-weight: 800; text-align: center; margin: 0 0 12px 0;">✓ केंद्रप्रमुख प्रमाणीकरण यशस्वी</p>

                <span>स्वयंचलित सिंक (Auto-Sync)</span>

                <button type="button" class="action-btn btn-sync" onclick="triggerManualSync()">ऑनलाइन सेव्ह करा</button>

            <label>नवीन PIN ची पुष्टी करा:</label>

                <div style="display: flex; flex-direction: column; gap: 8px;">

                    <button type="button" class="action-btn btn-danger" onclick="deleteFromGoogleSheets()">ऑनलाइन शीट मधील डेटा डिलीट करा</button>
                </div>

            <div class="modal-actions" style="margin-top: 12px;">
                <button type="button" class="action-btn btn-danger" onclick="logoutAdmin()" style="width: 100%;">लॉगआउट</button>
                <button type="button" class="action-btn btn-admin" onclick="closeAdminModal()" style="width: 100%;">बंद करा</button>
            </div>
        </div>
    </div>
</div>

<script>
    const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw8nCZspj98-skk_zIVhP0V0gPVd8i0koezh5_QefBjAsMdpxvOIHjPKOlOK_Yei8g/exec"; 

    const monthsMarathi = ["जानेवारी", "फेब्रुवारी", "मार्च", "एप्रिल", "मे", "जून", "जुलै", "ऑगस्ट", "सप्टेंबर", "ऑक्टोबर", "नोव्हेंबर", "डिसेंबर"];
    const daysMarathi = ["रविवार", "सोमवार", "मंगळवार", "बुधवार", "गुरुवार", "शुक्रवार", "शनिवार"];
    
    const schoolsList = [
        "सी.पी.एस. रविवार पेठ", "जि.प.प्रा.शा. क्र. २, अंबाजोगाई", "जि.प.प्रा.शा. साकुड (मराठी)", 
        "जि.प.प्रा.शा. साकुड (उर्दू)", "जि.प.प्रा.शा. काळवटी तांडा क्र. १", "जि.प.प्रा.शा. काळवटी तांडा क्र. ३", 
        "जि.प.प्रा.शा. भीमाई वस्ती", "जि.प.प्रा.शा. काळवटी तांडा क्र. २", "जि.प.प्रा.शा. मांडवा पठाण", 
        "जि.प.प्रा.शा. मांडवा तांडा", "जि.प.प्रा.शा. पोलेवाडी", "जि.प.प्रा.शा. नागझरी वसाहत", 
        "जि.प.प्रा.शा. शेपवाडी", "जि.प.प्रा.शा. सह्याद्री नगर शेपवाडी", "जि.प.प्रा.शा. पिंपळा धायगुडा (मराठी)", 
        "जि.प.प्रा.शा. पिंपळा धायगुडा (उर्दू)", "जि.प.प्रा.शा. वरवटी", "जि.प.प्रा.शा. उघडे वस्ती (वरवटी)", 
        "जि.प.प्रा.शा. तलाव पाटी", "जि.प.प्रा.शा. अंबलवाडी", "जि.प. प्रा. शा. गोलटावस्ती", 
        "जि.प.प्रा.शा. गिरवली आपेट", "जि.प.हा.स्कू. गिरवली",
        "समूह साधन केंद्र रविवार पेठ", "गटशिक्षणाधिकारी कार्यालय अंबाजोगाई"
    ];

    let autoSyncTimer = null;
    let verifiedSessionPin = sessionStorage.getItem('KP_ADMIN_PIN') || "";
    let isAutoSyncEnabled = localStorage.getItem('KP_AUTOSYNC') !== 'false';

    function initDates() {
        const monthSelect = document.getElementById('monthSelect');
        const yearSelect = document.getElementById('yearSelect');
        const currentDate = new Date();
        monthSelect.innerHTML = '';
        yearSelect.innerHTML = '';
        monthsMarathi.forEach((month, index) => {
            let option = document.createElement('option');
            option.value = index; option.textContent = month;
            if (index === currentDate.getMonth()) option.selected = true;
            monthSelect.appendChild(option);
        });
        let currentYear = currentDate.getFullYear();
        for (let y = currentYear - 2; y <= currentYear + 5; y++) {
            let option = document.createElement('option');
            option.value = y; option.textContent = y;
            if (y === currentYear) option.selected = true;
            yearSelect.appendChild(option);
        }
        document.getElementById('autoSyncToggle').checked = isAutoSyncEnabled;
        loadFormData();
    }

    function autoExpandTextarea(tx) {
        tx.style.height = 'auto';
        tx.style.height = Math.max(40, tx.scrollHeight) + 'px';
    }

    function validateTime(input, min, max) {
        if(!input.value) return;
        const row = input.closest('tr');
        const isWhole = row.querySelector('.cb-whole')?.checked;
        let actualMax = max;
        if(isWhole && min === '08:00') { actualMax = '17:00'; }

        if (input.value < min || input.value > actualMax) {
            alert(`कृपया वेळ ${min} ते ${actualMax} च्या दरम्यान निवडा.`);
            input.value = '';
        }
    }

    function getSchoolDropdownHTML(placeholderText, className) {
        let optionsHTML = `<option value="">-- शाळा निवडा --</option>`;
        schoolsList.forEach(school => optionsHTML += `<option value="${school}">${school}</option>`);
        optionsHTML += `<option value="manual">इतर (मॅन्युअल)</option>`;
        return `<select class="school-select no-print" onchange="handleDropdownSelect(this)">${optionsHTML}</select>
                <textarea class="${className}" placeholder="${placeholderText}" oninput="autoExpandTextarea(this); handleFormChange(this);"></textarea><div class="print-text"></div>`;
    }

    function getWorkNatureDropdownHTML(className) {
        return `<select class="school-select no-print" onchange="handleDropdownSelect(this)">
                    <option value="">-- स्वरूप निवडा --</option>
                    <option value="नियोजित शाळा भेट">नियोजित शाळा भेट</option>
                    <option value="आकस्मिक शाळा भेट">आकस्मिक शाळा भेट</option>
                    <option value="manual">इतर (टाइप करा)</option>
                </select>
                <textarea class="${className}" placeholder="कामाचे स्वरूप लिहा..." oninput="autoExpandTextarea(this); handleFormChange(this);"></textarea><div class="print-text"></div>`;
    }

    function handleDropdownSelect(selectElement) {
        const textarea = selectElement.nextElementSibling;
        if (selectElement.value === "manual") { textarea.value = ""; textarea.focus(); }
        else if (selectElement.value !== "") { textarea.value = selectElement.value; }
        autoExpandTextarea(textarea);
        handleFormChange(textarea);
    }

    function getTaskItemHTMLInner(colType, isLastCol = false, sessionType = 'morning') {
        let inputHTML = '';
        let timeHTML = '';
        
        if (colType === 'planned' || colType === 'actual') {
            let minT = sessionType === 'morning' ? '08:00' : '14:00';
            let maxT = sessionType === 'morning' ? '13:00' : '16:30';
            
            timeHTML = `
            <div class="task-timing no-print">
                <span style="font-size:11px; font-weight:700; color:var(--text-color);">वेळ:</span>
                <input type="time" class="task-time-from" min="${minT}" max="${maxT}" onchange="validateTime(this, '${minT}', '${maxT}'); handleFormChange(this);">
                <span style="font-size:11px; font-weight:700;">ते</span>
                <input type="time" class="task-time-to" min="${minT}" max="${maxT}" onchange="validateTime(this, '${minT}', '${maxT}'); handleFormChange(this);">
            </div>
            <div class="print-task-time"></div>
            `;
            inputHTML = timeHTML + getSchoolDropdownHTML('भेट...', `input-${colType}`);
        } else if (colType === 'work') {
            inputHTML = getWorkNatureDropdownHTML(`input-${colType}`);
        }
        
        let removeBtn = `<button type="button" class="remove-task-btn no-print" onclick="removeTask(this)" title="काम काढून टाका" style="background:transparent; color:#dc2626; border:1px solid #dc2626; border-radius:2px; padding:2px 8px; cursor:pointer; font-size:11px; margin-top: 4px; font-weight:700; width: fit-content;">[X] काढा</button>`;
        
        if (isLastCol) {
             return `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100%;">
                        <div style="width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1;">${inputHTML}</div>
                        ${removeBtn}
                     </div>`;
        }
        return inputHTML;
    }

    function getCellTemplate() {
        return `
            <div class="td-content">
                <div class="session-block morning-block" style="width:100%;">
                    <div class="task-list"></div>
                </div>
                <div class="session-block afternoon-block" style="width:100%;">
                    <div class="task-list"></div>
                </div>
            </div>
        `;
    }

    function addTaskToDOM(tr, sessionType) {
        const blockClass = sessionType === 'morning' ? '.morning-block' : '.afternoon-block';
        ['planned', 'actual', 'work'].forEach(col => {
            const list = tr.querySelector(`.col-${col} ${blockClass} .task-list`);
            if(list) {
                const div = document.createElement('div');
                div.className = 'task-item';
                div.innerHTML = getTaskItemHTMLInner(col, col === 'work', sessionType);
                list.appendChild(div);
            }
        });
        alignRowBlocks(tr);
    }

    function addTaskBtnClick(btn, sessionType) {
        const tr = btn.closest('tr');
        addTaskToDOM(tr, sessionType);
        handleFormChange(tr);
    }

    function removeTask(btn) {
        const taskItem = btn.closest('.task-item');
        const taskList = taskItem.parentElement;
        const sessionBlock = taskList.parentElement;
        const tr = sessionBlock.closest('tr');

        const sessionClass = sessionBlock.classList.contains('morning-block') ? '.morning-block' : '.afternoon-block';
        const taskItems = Array.from(taskList.children);
        const index = taskItems.indexOf(taskItem);

        if(taskItems.length <= 1) {
            alert("सत्रातील किमान एक काम असणे आवश्यक आहे. तुम्ही बॉक्स रिकामा सोडू शकता.");
            return;
        }

        ['planned', 'actual', 'work'].forEach(col => {
            const items = tr.querySelectorAll(`.col-${col} ${sessionClass} .task-item`);
            if(items[index]) items[index].remove();
        });

        alignRowBlocks(tr);
        handleFormChange(tr);
    }

    function handleSessionToggle(checkbox, type) {
        const row = checkbox.closest('tr');
        const cbWhole = row.querySelector('.cb-whole');
        const cbMorning = row.querySelector('.cb-morning');
        const cbAfternoon = row.querySelector('.cb-afternoon');

        if (type === 'whole' && cbWhole.checked) {
            cbMorning.checked = false; 
            cbAfternoon.checked = false;
        } else if ((type === 'morning' || type === 'afternoon') && checkbox.checked) {
            cbWhole.checked = false;
        }
        
        if (!cbWhole.checked && !cbMorning.checked && !cbAfternoon.checked) {
            cbWhole.checked = true;
        }

        updateRowSessionUI(row);
        
        if (cbMorning.checked && row.querySelectorAll('.col-planned .morning-block .task-item').length === 0) addTaskToDOM(row, 'morning');
        if (cbAfternoon.checked && row.querySelectorAll('.col-planned .afternoon-block .task-item').length === 0) addTaskToDOM(row, 'afternoon');
        if (cbWhole.checked && row.querySelectorAll('.col-planned .morning-block .task-item').length === 0) addTaskToDOM(row, 'morning');

        alignRowBlocks(row);
        handleFormChange(checkbox);
    }

    function updateRowSessionUI(row) {
        if (row.getAttribute('data-is-holiday') === 'true') return;
        
        const cbWhole = row.querySelector('.cb-whole').checked;
        const cbMorn = row.querySelector('.cb-morning').checked;
        const cbAft = row.querySelector('.cb-afternoon').checked;

        row.classList.remove('mode-whole', 'mode-morning', 'mode-afternoon', 'mode-both');
        
        if (cbWhole) row.classList.add('mode-whole');
        else if (cbMorn && cbAft) row.classList.add('mode-both');
        else if (cbMorn) row.classList.add('mode-morning');
        else if (cbAft) row.classList.add('mode-afternoon');

        const btnM = row.querySelector('.morning-add-btn');
        const btnA = row.querySelector('.afternoon-add-btn');
        if(btnM) btnM.style.display = (cbMorn || cbWhole) ? 'block' : 'none';
        if(btnA) btnA.style.display = cbAft ? 'block' : 'none';
    }

    function generateTableStructure() {
        const month = parseInt(document.getElementById('monthSelect').value);
        const year = parseInt(document.getElementById('yearSelect').value);
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 1; i <= daysInMonth; i++) {
            let date = new Date(year, month, i);
            let isSunday = date.getDay() === 0;
            let dayName = daysMarathi[date.getDay()];
            let dateText = `${i} ${monthsMarathi[month]} <span class="no-print">${year}</span><br><b>(${dayName})</b>`;
            let row = document.createElement('tr');
            row.setAttribute('data-date', `${i} ${monthsMarathi[month]} ${year}`);
            row.setAttribute('data-day-index', i);
            row.setAttribute('data-is-sunday', isSunday ? 'true' : 'false');

            if (isSunday) renderHolidayRow(row, i, dateText, "सार्वजनिक सुट्टी (रविवार)", true);
            else renderNormalRow(row, i, dateText);
            
            tbody.appendChild(row);
        }
    }

    function renderNormalRow(row, i, dateText) {
        let isSunday = row.getAttribute('data-is-sunday') === 'true';
        row.className = 'mode-whole'; 
        row.setAttribute('data-is-holiday', 'false');
        
        let extraBadge = isSunday ? `<div class="holiday-badge working-sunday-badge" style="margin-top:2px;">कामकाज (रविवार)</div>` : ``;

        row.innerHTML = `
            <td class="date-cell-mobile">
                <div class="date-text-print">${dateText}</div>
                ${extraBadge}
            </td>
            <td class="col-session p-0" data-label="सत्र / स्वरूप">
                <div class="td-content">
                    <div class="session-setup-wrapper no-print">
                        <div class="session-box">
                            <label><input type="checkbox" class="cb-whole" onchange="handleSessionToggle(this, 'whole')" checked> पूर्ण</label>
                            <label><input type="checkbox" class="cb-morning" onchange="handleSessionToggle(this, 'morning')"> सकाळ</label>
                            <label><input type="checkbox" class="cb-afternoon" onchange="handleSessionToggle(this, 'afternoon')"> दुपार</label>
                        </div>
                        <div class="add-btn-group">
                            <button type="button" class="task-btn morning-add-btn" onclick="addTaskBtnClick(this, 'morning')">+ सकाळ</button>
                            <button type="button" class="task-btn afternoon-add-btn" onclick="addTaskBtnClick(this, 'afternoon')">+ दुपार</button>
                        </div>
                        <label class="holiday-toggle-wrapper" style="width:100%;">
                            <input type="checkbox" onchange="toggleManualHoliday(this, ${i})"><span>सुट्टी घोषित</span>
                        </label>
                    </div>
                    <div class="morning-label-box" style="padding: 4px; display: flex; flex-direction: column; justify-content: center; height: 100%; width: 100%;">
                        <div style="font-weight: 800; font-size: 14px; color: var(--primary-color); text-align: center; background: #e0f2fe; padding: 2px; border-radius: 3px; margin: auto 0;">सकाळ सत्र</div>
                    </div>
                    <div class="afternoon-label-box" style="padding: 4px; flex: 1; display: flex; flex-direction: column; justify-content: center; width: 100%;">
                        <div style="font-weight: 800; font-size: 14px; color: var(--primary-color); text-align: center; background: #f0f9ff; padding: 2px; border-radius: 3px; margin: auto 0;">दुपार सत्र</div>
                    </div>
                </div>
            </td>
            <td class="col-planned p-0" data-label="नियोजित भेट">${getCellTemplate()}</td>
            <td class="col-actual p-0" data-label="प्रत्यक्ष भेट">${getCellTemplate()}</td>
            <td class="col-work p-0" data-label="कामाचे स्वरूप">${getCellTemplate()}</td>
        `;
        addTaskToDOM(row, 'morning'); 
        addTaskToDOM(row, 'afternoon'); 
        updateRowSessionUI(row);
    }

    function renderHolidayRow(row, i, dateText, reasonText, isSunday = false) {
        row.className = 'holiday-row';
        row.setAttribute('data-is-holiday', 'true');
        let badgeHTML = isSunday ? `<div class="holiday-badge" style="margin-top:2px;">रविवार सुट्टी</div>` : `<div class="holiday-badge" style="margin-top:2px;">सार्वजनिक सुट्टी</div>`;

        row.innerHTML = `
            <td class="date-cell-mobile">
                <div class="date-text-print">${dateText}</div>
                ${badgeHTML}
            </td>
            <td colspan="4" class="holiday-input-container">
                <div class="holiday-full-row">
                    <span class="holiday-icon-label">सुट्टी</span>
                    <input type="text" class="holiday-reason-input no-print" value="${reasonText}" oninput="handleFormChange()" placeholder="सुट्टीचे कारण लिहा...">
                    <div class="print-text holiday-print-text" style="display:none;">${reasonText}</div>
                    <label class="holiday-toggle-wrapper no-print" style="color:#15803d; border-color:#16a34a; background:#dcfce7; margin:0;">
                         <input type="checkbox" checked onchange="toggleManualHoliday(this, ${i})"><span>काम नोंदवा</span>
                    </label>
                </div>
            </td>
        `;
    }

    function toggleManualHoliday(checkbox, i) {
        const month = parseInt(document.getElementById('monthSelect').value);
        const year = parseInt(document.getElementById('yearSelect').value);
        const row = checkbox.closest('tr');
        const isSunday = row.getAttribute('data-is-sunday') === 'true';
        let date = new Date(year, month, i);
        let dateText = `${i} ${monthsMarathi[month]} <span class="no-print">${year}</span><br><b>(${daysMarathi[date.getDay()]})</b>`;

        if (checkbox.checked) {
            let defReason = isSunday ? "सार्वजनिक सुट्टी (रविवार)" : "सार्वजनिक सुट्टी";
            let reason = isSunday ? defReason : prompt("सुट्टीचे नाव / स्वरूप लिहा:", defReason);
            renderHolidayRow(row, i, dateText, reason || defReason, isSunday);
        } else { 
            renderNormalRow(row, i, dateText); 
        }
        handleFormChange();
    }

    function alignRowBlocks(row) {
        if (row.getAttribute('data-is-holiday') === 'true') return;
        
        row.querySelectorAll('.task-item').forEach(el => el.style.minHeight = 'auto');
        row.querySelectorAll('.morning-label-box, .morning-block, .afternoon-label-box, .afternoon-block').forEach(el => el.style.minHeight = 'auto');

        ['.morning-block', '.afternoon-block'].forEach(blockCls => {
            const cols = ['planned', 'actual', 'work'];
            const taskLists = cols.map(c => row.querySelectorAll(`.col-${c} ${blockCls} .task-item`));
            const rowCount = Math.max(...taskLists.map(list => list.length));

            for (let i = 0; i < rowCount; i++) {
                let maxHeight = 0;
                cols.forEach((_, colIdx) => {
                    const item = taskLists[colIdx][i];
                    if (item) {
                        const h = item.scrollHeight || item.offsetHeight;
                        if (h > maxHeight) maxHeight = h;
                    }
                });
                if (maxHeight > 0) {
                    cols.forEach((_, colIdx) => {
                        const item = taskLists[colIdx][i];
                        if (item) item.style.minHeight = maxHeight + 'px';
                    });
                }
            }
        });

        if (row.classList.contains('mode-both')) {
            let mLabel = row.querySelector('.morning-label-box');
            let mBlocks = Array.from(row.querySelectorAll('.morning-block'));
            let maxM = mLabel ? (mLabel.scrollHeight || mLabel.offsetHeight) : 0;
            mBlocks.forEach(b => { 
                let bh = b.scrollHeight || b.offsetHeight;
                if (bh > maxM) maxM = bh; 
            });
            mBlocks.forEach(b => b.style.minHeight = maxM + 'px');
            if (mLabel) mLabel.style.minHeight = maxM + 'px';
            
            let aLabel = row.querySelector('.afternoon-label-box');
            let aBlocks = Array.from(row.querySelectorAll('.afternoon-block'));
            let maxA = aLabel ? (aLabel.scrollHeight || aLabel.offsetHeight) : 0;
            aBlocks.forEach(b => { 
                let ah = b.scrollHeight || b.offsetHeight;
                if (ah > maxA) maxA = ah; 
            });
            aBlocks.forEach(b => b.style.minHeight = maxA + 'px');
            if (aLabel) aLabel.style.minHeight = maxA + 'px';
        }
    }

    function syncRowVisuals(row) {
        row.querySelectorAll('textarea').forEach(tx => {
            const printDiv = tx.nextElementSibling;
            if (printDiv && printDiv.classList.contains('print-text')) printDiv.textContent = tx.value;
        });
        
        let holInput = row.querySelector('.holiday-reason-input');
        let holPrint = row.querySelector('.holiday-print-text');
        if(holInput && holPrint) {
            holPrint.textContent = holInput.value;
        }
        
        if (row.getAttribute('data-is-holiday') === 'false') {
            row.querySelectorAll('.col-planned .task-item, .col-actual .task-item').forEach(item => {
                const tf = item.querySelector('.task-time-from')?.value;
                const tt = item.querySelector('.task-time-to')?.value;
                const pt = item.querySelector('.print-task-time');
                if (pt) {
                    if (tf || tt) pt.textContent = `[वेळ: ${tf || '--'} ते ${tt || '--'}]`;
                    else pt.textContent = '';
                }
            });
            alignRowBlocks(row);
        }
    }

    window.addEventListener('resize', () => {
        document.querySelectorAll('#tableBody tr').forEach(row => { if (row.getAttribute('data-is-holiday') === 'false') alignRowBlocks(row); });
    });
    window.addEventListener('beforeprint', () => {
        document.querySelectorAll('#tableBody tr').forEach(row => { 
            syncRowVisuals(row);
            if (row.getAttribute('data-is-holiday') === 'false') alignRowBlocks(row); 
        });
    });

    function getStorageKey() { return `DAINANDINI_V7_${document.getElementById('monthSelect').value}_${document.getElementById('yearSelect').value}`; }

    function handleFormChange(elem) {
        if (elem && elem.closest('tr')) syncRowVisuals(elem.closest('tr'));
        saveToLocalStorage();
        updateSyncBadge("स्थानिक ड्राफ्ट सेव्ह झाला", "synced");
        if (verifiedSessionPin && isAutoSyncEnabled) {
            clearTimeout(autoSyncTimer);
            updateSyncBadge("ऑटो-सिंक प्रलंबित...", "syncing");
            autoSyncTimer = setTimeout(() => syncToGoogleSheets(verifiedSessionPin, true), 3000);
        }
    }

    function saveToLocalStorage() {
        const entries = [];
        document.querySelectorAll('#tableBody tr').forEach(row => {
            const isHol = row.getAttribute('data-is-holiday') === 'true';
            let entry = {
                day: row.getAttribute('data-day-index'), 
                isHoliday: isHol,
                holidayReason: isHol ? (row.querySelector('.holiday-reason-input') ? row.querySelector('.holiday-reason-input').value : '') : '',
                cbWhole: isHol ? true : row.querySelector('.cb-whole')?.checked,
                cbMorning: isHol ? false : row.querySelector('.cb-morning')?.checked,
                cbAfternoon: isHol ? false : row.querySelector('.cb-afternoon')?.checked,
                morningTasks: [], afternoonTasks: []
            };

            if (!isHol) {
                const getTaskData = (block) => {
                    let taskArr = [];
                    let pNodes = row.querySelectorAll(`.col-planned ${block} .task-item`);
                    let aNodes = row.querySelectorAll(`.col-actual ${block} .task-item`);
                    let wNodes = row.querySelectorAll(`.col-work ${block} .task-item`);
                    
                    for(let i=0; i<pNodes.length; i++) {
                        taskArr.push({
                            timeFrom: pNodes[i].querySelector('.task-time-from')?.value || '',
                            timeTo: pNodes[i].querySelector('.task-time-to')?.value || '',
                            planned: pNodes[i].querySelector('.input-planned')?.value || '',
                            actualTimeFrom: aNodes[i]?.querySelector('.task-time-from')?.value || '',
                            actualTimeTo: aNodes[i]?.querySelector('.task-time-to')?.value || '',
                            actual: aNodes[i]?.querySelector('.input-actual')?.value || '',
                            work: wNodes[i]?.querySelector('.input-work')?.value || ''
                        });
                    }
                    return taskArr;
                };

                entry.morningTasks = getTaskData('.morning-block');
                entry.afternoonTasks = getTaskData('.afternoon-block');
            }
            entries.push(entry);
        });
        localStorage.setItem(getStorageKey(), JSON.stringify({
            kendraPramukhName: document.getElementById('kendraPramukhNameInput').value,
            kendra: document.getElementById('kendraInput').value,
            taluka: document.getElementById('talukaInput').value, jilha: document.getElementById('jilhaInput').value,
            entries: entries
        }));
    }

    function loadFormData() {
        generateTableStructure();
        const saved = localStorage.getItem(getStorageKey());
        if (!saved) return;
        
        try {
            const data = JSON.parse(saved);
            if (data.kendraPramukhName) document.getElementById('kendraPramukhNameInput').value = data.kendraPramukhName;
            if (data.kendra) document.getElementById('kendraInput').value = data.kendra;
            if (data.taluka) document.getElementById('talukaInput').value = data.taluka;
            if (data.jilha) document.getElementById('jilhaInput').value = data.jilha;

            const m = parseInt(document.getElementById('monthSelect').value), y = parseInt(document.getElementById('yearSelect').value);

            data.entries.forEach(item => {
                const row = document.querySelector(`#tableBody tr[data-day-index="${item.day}"]`);
                if (!row) return;
                
                let isSun = row.getAttribute('data-is-sunday') === 'true';
                let dt = new Date(y, m, parseInt(item.day));
                let dtText = `${item.day} ${monthsMarathi[m]} <span class="no-print">${y}</span><br><b>(${daysMarathi[dt.getDay()]})</b>`;

                if (item.isHoliday) {
                    renderHolidayRow(row, item.day, dtText, item.holidayReason || (isSun ? "सार्वजनिक सुट्टी (रविवार)" : "सुट्टी"), isSun);
                } else {
                    renderNormalRow(row, item.day, dtText);
                    
                    if (item.cbWhole !== undefined) {
                        row.querySelector('.cb-whole').checked = item.cbWhole;
                        row.querySelector('.cb-morning').checked = item.cbMorning;
                        row.querySelector('.cb-afternoon').checked = item.cbAfternoon;
                    }
                    
                    ['morning', 'afternoon'].forEach(sType => {
                        let taskArr = sType === 'morning' ? item.morningTasks : item.afternoonTasks;
                        if (taskArr && taskArr.length > 0) {
                            const bCls = sType === 'morning' ? '.morning-block' : '.afternoon-block';
                            ['planned','actual','work'].forEach(c => row.querySelector(`.col-${c} ${bCls} .task-list`).innerHTML = '');
                            
                            taskArr.forEach((tData, idx) => {
                                addTaskToDOM(row, sType);
                                let pTf = row.querySelectorAll(`.col-planned ${bCls} .task-time-from`)[idx];
                                if (pTf) pTf.value = tData.timeFrom || '';
                                let pTt = row.querySelectorAll(`.col-planned ${bCls} .task-time-to`)[idx];
                                if (pTt) pTt.value = tData.timeTo || '';
                                let pIn = row.querySelectorAll(`.col-planned ${bCls} .input-planned`)[idx];
                                if (pIn) { pIn.value = tData.planned || ''; autoExpandTextarea(pIn); }
                                
                                let actualTf = row.querySelectorAll(`.col-actual ${bCls} .task-time-from`)[idx];
                                if(actualTf) actualTf.value = tData.actualTimeFrom || '';
                                let actualTt = row.querySelectorAll(`.col-actual ${bCls} .task-time-to`)[idx];
                                if(actualTt) actualTt.value = tData.actualTimeTo || '';

                                let aIn = row.querySelectorAll(`.col-actual ${bCls} .input-actual`)[idx];
                                if (aIn) { aIn.value = tData.actual || ''; autoExpandTextarea(aIn); }
                                let wIn = row.querySelectorAll(`.col-work ${bCls} .input-work`)[idx];
                                if (wIn) { wIn.value = tData.work || ''; autoExpandTextarea(wIn); }
                            });
                        }
                    });
                    
                    updateRowSessionUI(row);
                }
                syncRowVisuals(row);
            });
        } catch(e) { console.error("Load error:", e); }
    }

    function onMonthYearChange() { loadFormData(); }
    function updateSyncBadge(t, c) { document.getElementById('syncStatus').textContent = t; document.getElementById('syncStatus').className = `sync-badge ${c}`; }
    function prepareAndPrint() { 
        document.querySelectorAll('#tableBody tr').forEach(row => {
            syncRowVisuals(row);
            if(row.getAttribute('data-is-holiday') === 'false') alignRowBlocks(row);
        });
        window.print(); 
    }
    
    async function syncToGoogleSheets(pinToUse, isAuto = false) {
        if (!isAuto) updateSyncBadge("ऑनलाइन सेव्ह होत आहे...", "syncing");
        
        let entries = [];
        document.querySelectorAll('#tableBody tr').forEach(row => {
            let dayIndex = row.getAttribute('data-day-index');
            let isHol = row.getAttribute('data-is-holiday') === 'true';
            
            let sMode = '', p = '', a = '', w = '', r = '', hR = '';

            if (isHol) {
                hR = row.querySelector('.holiday-reason-input') ? row.querySelector('.holiday-reason-input').value.trim() : "सार्वजनिक सुट्टी";
                p = hR; a = hR; w = hR; r = ""; sMode = "सुट्टी";
            } else {
                let cbW = row.querySelector('.cb-whole')?.checked;
                let cbM = row.querySelector('.cb-morning')?.checked;
                let cbA = row.querySelector('.cb-afternoon')?.checked;
                sMode = cbW ? 'पूर्ण दिवस' : ((cbM && cbA) ? 'सकाळ व दुपार' : (cbM ? 'सकाळ सत्र' : 'दुपार सत्र'));

                const extractTaskData = (blockCls) => {
                    let tasks = [];
                    let rows = Array.from(row.querySelectorAll(`.col-planned ${blockCls} .task-item`));
                    rows.forEach((item, i) => {
                       let tf = item.querySelector('.task-time-from')?.value || '';
                       let tt = item.querySelector('.task-time-to')?.value || '';
                       
                       let actualNode = row.querySelectorAll(`.col-actual ${blockCls} .task-item`)[i];
                       let atf = actualNode?.querySelector('.task-time-from')?.value || '';
                       let att = actualNode?.querySelector('.task-time-to')?.value || '';

                       let pVal = item.querySelector('.input-planned')?.value.trim() || '';
                       let aVal = actualNode?.querySelector('.input-actual')?.value.trim() || '';
                       let wVal = row.querySelectorAll(`.col-work ${blockCls} .input-work`)[i]?.value.trim() || '';
                       
                       if(pVal || aVal || wVal) tasks.push({tf, tt, atf, att, p:pVal, a:aVal, w:wVal});
                    });
                    return tasks;
                };
                
                let tM = (cbM || cbW) ? extractTaskData('.morning-block') : [];
                let tA = cbA ? extractTaskData('.afternoon-block') : [];

                const formatCol = (arr, key, includeTime) => {
                    return arr.map((t, i) => {
                        let pref = arr.length > 1 ? `${i+1}) ` : ``;
                        let timeStr = ``;
                        if (includeTime) {
                            if (key === 'p' && (t.tf || t.tt)) timeStr = `[${t.tf||'--'} ते ${t.tt||'--'}] `;
                            if (key === 'a' && (t.atf || t.att)) timeStr = `[${t.atf||'--'} ते ${t.att||'--'}] `;
                        }
                        let val = t[key];
                        return val ? `${pref}${timeStr}${val}`.trim() : ``;
                    }).filter(v=>v).join('\n');
                };

                const buildText = (arrM, arrA, key, includeTime) => {
                    let textM = formatCol(arrM, key, includeTime);
                    let textA = formatCol(arrA, key, includeTime);
                    if(cbM && cbA) return (textM ? `सकाळ:\n${textM}` : "") + (textM && textA ? "\n\n" : "") + (textA ? `दुपार:\n${textA}` : "");
                    return textM || textA;
                };

                p = buildText(tM, tA, 'p', true);  
                a = buildText(tM, tA, 'a', true);
                w = buildText(tM, tA, 'w', false);
                r = ""; // Setting empty for backend compatibility 
            }
            
            if (p || a || w || sMode) {
                entries.push({ day: dayIndex, date: row.getAttribute('data-date'), isHoliday: isHol, holidayReason: hR,
                               fromTime: '', toTime: '', session: sMode, timing: '', planned: p, actual: a, work: w, remarks: r });
            }
        });

        let payload = {
            action: "syncData", pin: pinToUse, 
            month: document.getElementById('monthSelect').options[document.getElementById('monthSelect').selectedIndex].text,
            year: document.getElementById('yearSelect').value,
            data: {
                kendraPramukhName: document.getElementById('kendraPramukhNameInput').value.trim(),
                kendra: document.getElementById('kendraInput').value.trim(),
                taluka: document.getElementById('talukaInput').value.trim(),
                jilha: document.getElementById('jilhaInput').value.trim(),
                entries: entries
            }
        };

        try {
            let res = await fetch(GOOGLE_WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) }).then(r=>r.json());
            if (res.status === 'success') {
                updateSyncBadge(`ऑनलाइन सिंक पूर्ण`, "synced");
                if (!isAuto) alert("माहिती Google Sheets मध्ये सेव्ह झाली!");
            } else {
                updateSyncBadge("सिंक अयशस्वी", ""); if (!isAuto) alert("त्रुटी: " + res.message);
            }
        } catch (error) { updateSyncBadge("ऑफलाइन मोड", ""); if (!isAuto) alert("सर्व्हरशी संपर्क होऊ शकला नाही."); }
    }

    function openAdminPanel() { document.getElementById('adminModal').style.display = 'flex'; if (verifiedSessionPin) showAdminControls(); else showAdminLogin(); }
    function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; }
    function showAdminLogin() { document.getElementById('loginStep').style.display = 'block'; document.getElementById('adminControlsStep').style.display = 'none'; document.getElementById('authPinInput').value = ''; }
    function showAdminControls() { document.getElementById('loginStep').style.display = 'none'; document.getElementById('adminControlsStep').style.display = 'block'; }
    function logoutAdmin() { verifiedSessionPin = ""; sessionStorage.removeItem('KP_ADMIN_PIN'); clearTimeout(autoSyncTimer); updateSyncBadge("लॉगआउट केले", ""); alert("यशस्वीरित्या लॉगआउट."); showAdminLogin(); }
    function toggleAutoSync() { isAutoSyncEnabled = document.getElementById('autoSyncToggle').checked; localStorage.setItem('KP_AUTOSYNC', isAutoSyncEnabled); updateSyncBadge(isAutoSyncEnabled ? "ऑटो-सिंक चालू" : "ऑटो-सिंक बंद", isAutoSyncEnabled ? "synced" : ""); }
    function triggerManualSync() { if (!verifiedSessionPin) return alert("लॉगिन करा!"); syncToGoogleSheets(verifiedSessionPin); }
    
    async function verifyAdminLogin() {
        const pin = document.getElementById('authPinInput').value.trim(); if (!pin) return alert("PIN टाका!");
        updateSyncBadge("पडताळणी सुरू...", "syncing");
        try {
            let res = await fetch(GOOGLE_WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "verifyPin", pin: pin }) }).then(r => r.json());
            if (res.status === 'success') { verifiedSessionPin = pin; sessionStorage.setItem('KP_ADMIN_PIN', pin); showAdminControls(); updateSyncBadge("लॉगिन यशस्वी", "synced"); }
            else { alert("चुकीचा PIN!"); updateSyncBadge("चुकीचा PIN", ""); }
        } catch (err) { verifiedSessionPin = pin; sessionStorage.setItem('KP_ADMIN_PIN', pin); showAdminControls(); } 
    }

    async function fetchFromGoogleSheets() {
        if (!verifiedSessionPin) return alert("लॉगिन करा!");
        updateSyncBadge("डेटा मिळवत आहे...", "syncing");
        try {
            let month = document.getElementById('monthSelect').options[document.getElementById('monthSelect').selectedIndex].text;
            let year = document.getElementById('yearSelect').value;
            let res = await fetch(GOOGLE_WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "fetchData", pin: verifiedSessionPin, month: month, year: year }) }).then(r => r.json());
            if (res.status === 'success' && res.data) { localStorage.setItem(getStorageKey(), JSON.stringify(res.data)); loadFormData(); updateSyncBadge("डेटा मिळवला", "synced"); alert("ऑनलाइन डेटा अपडेट केला!"); closeAdminModal(); }
            else { updateSyncBadge("डेटा मिळाला नाही", ""); alert("त्रुटी: " + (res.message || "डेटा नाही.")); }
        } catch (err) { updateSyncBadge("ऑफलाइन मोड", ""); alert("सर्व्हरशी संपर्क नाही."); }
    }

    async function deleteFromGoogleSheets() {
        if (!verifiedSessionPin) return alert("लॉगिन करा!");
        let month = document.getElementById('monthSelect').options[document.getElementById('monthSelect').selectedIndex].text; let year = document.getElementById('yearSelect').value;
        if (!confirm(`${month} ${year} चा ऑनलाइन डेटा कायमचा डिलीट करायचा आहे का?`)) return;
        updateSyncBadge("डेटा डिलीट करत आहे...", "syncing");
        try {
            let res = await fetch(GOOGLE_WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "deleteData", pin: verifiedSessionPin, month: month, year: year }) }).then(r => r.json());
            if (res.status === 'success') {
                updateSyncBadge("डेटा डिलीट झाला", "synced"); alert(`ऑनलाइन डेटा डिलीट झाला!`);
                if (confirm("स्थानिक (Local) ड्राफ्ट पण डिलीट करायचा आहे का?")) { localStorage.removeItem(getStorageKey()); loadFormData(); } closeAdminModal();
            } else { updateSyncBadge("डिलीट अयशस्वी", ""); alert("त्रुटी: " + res.message); }
        } catch (err) { updateSyncBadge("ऑफलाइन मोड", ""); alert("सर्व्हरशी संपर्क नाही."); }
    }
    
    function clearLocalStorageDraft() {
        let m = document.getElementById('monthSelect').options[document.getElementById('monthSelect').selectedIndex].text, y = document.getElementById('yearSelect').value;
        if (confirm(`खात्री आहे का? केवळ या डिव्हाइसवरील ${m} ${y} चा ड्राफ्ट हटवला जाईल.`)) { localStorage.removeItem(getStorageKey()); loadFormData(); updateSyncBadge("ड्राफ्ट हटवला", ""); }
    }

    async function saveNewPinOnline() {
        const newPin = document.getElementById('newPin').value.trim(), confirmNewPin = document.getElementById('confirmNewPin').value.trim();
        if (!newPin || !confirmNewPin) return alert("सर्व पर्याय भरा!");
        if (newPin !== confirmNewPin) return alert("PIN जुळत नाहीत!");
        updateSyncBadge("PIN बदलत आहे...", "syncing");
        try {
            let res = await fetch(GOOGLE_WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "changePin", currentPin: verifiedSessionPin, newPin: newPin }) }).then(r => r.json());
            if (res.status === 'success') { alert("PIN बदलला!"); verifiedSessionPin = newPin; sessionStorage.setItem('KP_ADMIN_PIN', newPin); document.getElementById('newPin').value = ''; document.getElementById('confirmNewPin').value = ''; updateSyncBadge("PIN अपडेट झाला", "synced"); }
            else { alert("त्रुटी: " + res.message); }
        } catch (e) { alert("सर्व्हर संपर्क तुटला."); }
    }
